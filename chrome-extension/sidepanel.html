<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Bhai</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fbf8f4;
      --raised: #ffffff;
      --sunk: #f4eee7;
      --bubble: #f1e6da;
      --line: #ebe1d6;
      --ink: #241a12;
      --ink-2: #6f5f52;
      --ink-3: #a29384;
      --accent: #cf6a33;
      --accent-ink: #ffffff;
      --ok: #2f8a4c;
      --bad: #c2453b;
      --shadow: 0 1px 2px rgba(74, 42, 16, .04), 0 4px 16px rgba(74, 42, 16, .04);
      --tag-draw: #fbf3db; --tag-draw-ink: #8a5d00;
      --tag-sel: #e6f0f8; --tag-sel-ink: #245d86;
      --tag-tab: #edf3ec; --tag-tab-ink: #346538;
      --r-lg: 12px;
      --r-md: 9px;
      --r-sm: 6px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171310;
        --raised: #201a16;
        --sunk: #1c1713;
        --bubble: #2b221c;
        --line: #31281f;
        --ink: #f1e9e1;
        --ink-2: #ad9d8f;
        --ink-3: #7b6d61;
        --accent: #e07b42;
        --ok: #5bc27c;
        --bad: #ec6f63;
        --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 6px 18px rgba(0, 0, 0, .2);
        --tag-draw: #3a3017; --tag-draw-ink: #e8c46a;
        --tag-sel: #1d2c38; --tag-sel-ink: #8cc0e6;
        --tag-tab: #1f2c20; --tag-tab-ink: #93c79a;
      }
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
    svg { flex: none; }

    /* ── Header ─────────────────────────────── */
    .top { display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px 16px; min-height: 40px; }
    .status-text { font-size: 12px; color: var(--ink-2); }
    .status[data-state="on"], .status[data-state="on"] + .status-text { display: none; }
    .top { min-height: 34px; }
    .status { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); transition: background .3s; }
    .status[data-state="on"] { background: var(--ok); }
    .status[data-state="off"] { background: var(--bad); }
    .grow { flex: 1; }
    .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--r-md); color: var(--ink-2); transition: background .15s, color .15s, transform .1s; }
    .icon-btn:hover { background: var(--sunk); color: var(--ink); }
    .icon-btn:active { transform: scale(.94); }

    /* ── Thread ─────────────────────────────── */
    .thread { flex: 1; overflow-y: auto; padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
    .msg { animation: rise .18s ease-out both; }
    .bhai.reveal { animation: none; }
    .bhai.reveal > div:first-child > * { animation: rise .4s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--d, 0) * 70ms); }
    .reply-tools .icon-btn[aria-pressed="true"] { color: var(--accent); }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    .you { align-self: flex-end; max-width: 88%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .you .bubble { background: var(--bubble); padding: 8px 13px; border-radius: 16px 16px 5px 16px; white-space: pre-wrap; word-wrap: break-word; }
    .attach { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
    .tag { display: inline-flex; align-items: center; gap: 5px; max-width: 220px; font-size: 12px; color: var(--ink-2); padding: 2px 8px 2px 6px; border-radius: var(--r-sm); background: var(--sunk); }
    .tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag.draw { background: var(--tag-draw); color: var(--tag-draw-ink); }
    .tag.sel { background: var(--tag-sel); color: var(--tag-sel-ink); }
    .tag.tab { background: var(--tag-tab); color: var(--tag-tab-ink); }

    .bhai { max-width: 100%; overflow-wrap: anywhere; text-wrap: pretty; }
    .you .bubble { overflow-wrap: anywhere; }
    .bhai pre { position: relative; }
    .code-copy { position: absolute; top: 4px; right: 4px; font: 500 11px/1 -apple-system, sans-serif; color: var(--ink-2); padding: 4px 7px; border-radius: 5px; background: var(--raised); border: 1px solid var(--line); opacity: 0; transition: opacity .15s; }
    .bhai pre:hover .code-copy, .code-copy:focus-visible { opacity: 1; }
    .bhai .table-wrap { overflow-x: auto; }
    .bhai table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
    .bhai th, .bhai td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    .bhai th { font-weight: 600; color: var(--ink-2); }
    .thread { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .bhai > div > * + * { margin-top: 10px; }
    .bhai h3 { font-size: 14px; font-weight: 600; }
    .bhai ul, .bhai ol { padding-left: 20px; }
    .bhai li + li { margin-top: 3px; }
    .bhai strong { font-weight: 600; }
    .bhai a { color: var(--accent); text-underline-offset: 2px; }
    .bhai code { font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
    .bhai pre { background: var(--sunk); border-radius: var(--r-md); padding: 10px 12px; overflow-x: auto; }
    .bhai pre code { background: none; padding: 0; }
    .bhai blockquote { border-left: 2px solid var(--line); padding-left: 10px; color: var(--ink-2); }
    .reply-tools { margin-top: 4px; margin-left: -6px; opacity: 0; transition: opacity .15s; }
    .bhai:hover .reply-tools, .reply-tools:focus-within { opacity: 1; }
    .reply-tools .icon-btn { width: 26px; height: 26px; }
    .error { color: var(--bad); font-size: 13px; }
    .followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .followups button { font-size: 12.5px; padding: 5px 10px; border-radius: var(--r-md); border: 1px solid var(--line); color: var(--ink); text-align: left; transition: border-color .15s, background .15s, transform .1s; }
    .followups button:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: var(--raised); }
    .followups button:active { transform: scale(.97); }
    .links { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
    .links a { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; font-size: 13px; color: var(--accent); text-decoration: none; }
    .links a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .links a:hover span { text-decoration: underline; text-underline-offset: 2px; }
    .reply-tools { display: flex; align-items: center; gap: 2px; }
    .reply-tools .thanks { font-size: 12px; color: var(--ink-3); padding: 0 6px; }
    .reply-tools .link-btn { font-size: 12px; margin-left: 6px; }

    .working { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; animation: rise .18s ease-out both; }
    .working span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .working > span:last-child { background: linear-gradient(90deg, var(--ink-2) 0%, var(--ink-2) 40%, var(--ink) 50%, var(--ink-2) 60%, var(--ink-2) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite; }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
    .dots { display: flex; gap: 3px; }
    .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite ease-in-out; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

    /* ── Live turn: one line while Bhai works; Notes and Steps one click away ── */
    .turn-live { display: flex; align-items: center; gap: 10px; width: calc(100% + 12px); margin: 0 -6px; padding: 4px 6px; border-radius: var(--r-md); font-size: 13px; color: var(--ink-2); text-align: left; user-select: none; transition: background .15s; }
    .turn-live:hover { background: var(--sunk); }
    .turn-now { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: linear-gradient(90deg, var(--ink-2) 0 40%, var(--accent) 50%, var(--ink-2) 60% 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: turnShimmer 2.2s linear infinite; }
    .turn-meta { flex: none; display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .turn-meta .chev { transform: rotate(180deg); transition: transform .25s; }
    .turn.open .turn-meta .chev { transform: none; }
    .turn-bar { height: 3px; margin-top: 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .turn-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--accent); animation: turnSlide 1.6s ease-in-out infinite; }
    .turn-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease, margin .3s ease; }
    .turn-panel > div { overflow: hidden; }
    .turn.open .turn-panel { grid-template-rows: 1fr; margin-top: 8px; }
    .turn-inner { padding: 4px 10px 8px; border-radius: var(--r-md); background: var(--sunk); }
    .turn-empty { margin: 6px 0 2px; font-size: 12px; color: var(--ink-3); }
    .turn-lbl { margin: 6px 0 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
    .turn-notes { max-height: 96px; overflow-y: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; color: var(--ink-2); }
    .turn-step { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
    .turn-step > :first-child { flex: none; width: 12px; }
    .turn-step span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .turn-step.done svg { color: var(--ok); }
    .turn-step.failed svg { color: var(--bad); }
    .turn-step.running { font-weight: 500; color: var(--ink); }
    .turn-step.running i { height: 8px; width: 8px; margin: 0 2px; border-radius: 50%; background: var(--accent); animation: turnPulse 1.2s ease-in-out infinite; }
    .turn-answer { margin-top: 12px; }
    .turn-answer .caret { display: inline-block; width: 2px; height: 1em; margin-left: 1px; vertical-align: -2px; background: var(--accent); animation: turnBlink 1s steps(2) infinite; }
    .turn.done .face, .turn.done .turn-bar { display: none; }
    .turn.done .turn-live { font-size: 12.5px; }
    .turn.done .turn-now { animation: none; background: none; color: var(--ink-3); }
    /* Bhai's face, alive: bobs, blinks, glances, with a soft ripple while he works */
    .face { position: relative; flex: none; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f5b16b, #c2570f); animation: faceBob 1.6s ease-in-out infinite; }
    .face::before, .face::after { content: ""; position: absolute; top: 8px; width: 3px; height: 4px; border-radius: 2px; background: #fff; animation: faceBlink 3.2s infinite, faceLook 2.4s ease-in-out infinite; }
    .face::before { left: 6px; }
    .face::after { right: 6px; }
    .face i { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); animation: faceRipple 1.6s ease-out infinite; }
    @keyframes faceBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes faceBlink { 0%, 92%, 100% { height: 4px; } 95% { height: 1px; } }
    @keyframes faceLook { 0%, 100% { margin-left: 0; } 50% { margin-left: 2px; } }
    @keyframes faceRipple { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
    @keyframes turnPulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes turnShimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    @keyframes turnSlide { from { margin-left: -40%; } to { margin-left: 100%; } }
    @keyframes turnBlink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .turn-now { background: none; color: var(--ink-2); }
      .turn-bar i { width: 100%; opacity: .4; }
      .face i { display: none; }
    }

    /* ── Welcome ────────────────────────────── */
    .welcome { flex: 1; display: flex; flex-direction: column; }
    .hello { margin: auto 0; text-align: center; animation: rise .3s ease-out both; }
    .hello img { width: 30px; height: 30px; border-radius: 8px; animation: float 4.5s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .hello h1 { animation: rise .4s cubic-bezier(.16, 1, .3, 1) .05s both; }
    .tip { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); animation: rise .4s cubic-bezier(.16, 1, .3, 1) .2s both; }
    .tip:empty { display: none; }
    .you { position: relative; }
    .you .edit { position: absolute; left: -32px; top: 4px; opacity: 0; transition: opacity .15s; width: 26px; height: 26px; }
    .you:hover .edit, .you .edit:focus-visible { opacity: 1; }
    .hello h1 { margin-top: 10px; font: 500 21px/1.25 ui-serif, "New York", Georgia, serif; letter-spacing: -.015em; color: var(--ink); }
    .suggest { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding-bottom: 2px; }
    .suggest button { font-size: 13px; padding: 6px 12px; border-radius: var(--r-md); background: var(--sunk); color: var(--ink); transition: background .15s, transform .1s; animation: rise .35s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 60ms + 80ms); }
    .suggest button:hover:not(:disabled) { background: var(--bubble); transform: translateY(-1px); }
    .suggest button:active:not(:disabled) { transform: scale(.98); }
    .suggest button:disabled { opacity: .45; cursor: default; }

    .notice { border-left: 2px solid var(--bad); padding: 2px 0 2px 12px; font-size: 13px; }
    .notice strong { font-weight: 600; display: block; }
    .notice p { color: var(--ink-2); margin: 2px 0 6px; }
    .link-btn { color: var(--accent); font-weight: 500; font-size: 13px; }
    .link-btn:hover { text-decoration: underline; text-underline-offset: 2px; }

    /* ── Dock ───────────────────────────────── */
    .dock { position: relative; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
    .jump { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 5px 11px; border-radius: var(--r-md); background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--ink-2); animation: rise .2s ease-out both; }
    .jump:hover { color: var(--ink); }
    .pending { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); padding: 0 4px; animation: rise .15s ease-out both; }
    .pending .quote { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pending .link-btn { font-size: 12.5px; }
    .composer { position: relative; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 10px 10px 8px 13px; transition: border-color .15s; }
    .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
    textarea { width: 100%; border: none; outline: none; resize: none; background: none; color: var(--ink); font: inherit; max-height: 160px; display: block; }
    textarea::placeholder { color: var(--ink-3); }
    textarea:focus-visible { outline: none; }
    .tools { display: flex; align-items: center; gap: 2px; margin-top: 6px; margin-left: -5px; }
    .tool { height: 28px; min-width: 28px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: var(--r-sm); color: var(--ink-2); font-size: 12.5px; transition: background .15s, color .15s, transform .1s; }
    .tool:hover:not(:disabled) { background: var(--sunk); color: var(--ink); }
    .tool:active:not(:disabled) { transform: scale(.95); }
    .tool:disabled { opacity: .4; cursor: default; }
    .tool.at { font-weight: 600; font-size: 14px; }
    .tabtoggle img, .tabtoggle svg { width: 15px; height: 15px; border-radius: 3px; }
    .tabtoggle[aria-pressed="false"] { opacity: .45; }
    .tabtoggle[aria-pressed="false"]::after { content: ""; position: absolute; width: 18px; height: 1.5px; background: var(--ink-2); transform: rotate(-45deg); }
    .tabtoggle { position: relative; }
    .send { width: 30px; height: 30px; margin-left: 4px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); transition: transform .1s, opacity .15s, background .15s; }
    .send:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 82%, var(--bg)); }
    .send:active:not(:disabled) { transform: scale(.92); }
    .send:disabled { opacity: .35; cursor: default; }
    .send { position: relative; }
    .send svg { position: absolute; transition: opacity .18s, transform .25s cubic-bezier(.16, 1, .3, 1); }
    .send .stop-icon { opacity: 0; transform: scale(.4) rotate(-90deg); }
    .send.busy { background: var(--accent); color: #fff; }
    .send.busy .send-icon { opacity: 0; transform: translateY(-8px); }
    .send.busy .stop-icon { opacity: 1; transform: none; }
    .hint { font-size: 12px; color: var(--bad); padding: 0 4px; }
    .hint:empty { display: none; }

    .sharing { margin: -2px 0 6px -4px; }
    .share-head { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 6px 0 4px; border-radius: var(--r-sm); font-size: 12.5px; color: var(--ink-2); transition: background .15s, color .15s; }
    .share-head:hover { background: var(--sunk); color: var(--ink); }
    .share-head .chev { transform: rotate(180deg); transition: transform .2s; color: var(--ink-3); }
    .share-head[aria-expanded="true"] .chev { transform: none; }
    .favs { display: inline-flex; }
    .favs > * { width: 16px; height: 16px; border-radius: 50%; background: var(--sunk); border: 1.5px solid var(--raised); display: grid; place-items: center; color: var(--ink-3); overflow: hidden; }
    .favs > * + * { margin-left: -6px; }
    .favs img { object-fit: cover; }
    .share-list { list-style: none; margin: 2px 0 4px; display: flex; flex-direction: column; gap: 1px; animation: rise .12s ease-out both; }
    .share-list li { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 6px; border-radius: var(--r-sm); font-size: 12.5px; }
    .share-list li:hover { background: var(--sunk); }
    .share-list img, .share-list .ph { width: 14px; height: 14px; border-radius: 3px; flex: none; }
    .share-list .ph { background: var(--sunk); }
    .share-list .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .share-list .h { color: var(--ink-3); flex: none; max-width: 38%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .share-list .icon-btn { width: 22px; height: 22px; border-radius: 5px; }
    .attachment { position: relative; display: inline-block; margin: 0 0 6px; }
    .attachment img { display: block; max-height: 72px; max-width: 120px; border-radius: var(--r-md); border: 1px solid var(--line); }
    .attachment .icon-btn { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg); }
    .attachment .icon-btn:hover { background: var(--ink); color: var(--bg); }
    .composer.dragging { border-color: var(--accent); }
    .mention-menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 4px; box-shadow: var(--shadow); max-height: 264px; overflow-y: auto; animation: rise .12s ease-out both; z-index: 2; }
    .mention-head { font-size: 11.5px; color: var(--ink-3); padding: 6px 8px 4px; }
    .mention-item { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: var(--r-md); cursor: pointer; }
    .mention-item.active { background: var(--sunk); }
    .mention-item img, .mention-item .ph { width: 16px; height: 16px; border-radius: 3px; flex: none; }
    .mention-item .ph { background: var(--sunk); }
    .mention-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mention-host { font-size: 11.5px; color: var(--ink-3); max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mention-empty { padding: 8px; color: var(--ink-2); font-size: 13px; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <!-- One icon set, one stroke weight -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V6M6 11.5l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5L15.5 4.5z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20V3.5zM14 3.5V8h4M9.5 12.5h5M9.5 16h5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="i-ask" viewBox="0 0 24 24"><path d="M9.2 9.3a2.9 2.9 0 1 1 3.6 2.8c-.5.2-.8.6-.8 1.1v.8M12 17.3v.2" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.75"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5" fill="none" stroke="currentColor" stroke-width="1.75"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-quote" viewBox="0 0 24 24"><path d="M5 5.5h14M5 10h14M5 14.5h8" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6.5 14.5l5.5-5.5 5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
      <symbol id="i-up-thumb" viewBox="0 0 24 24"><path d="M7.5 10.5v9h-3v-9h3zM7.5 10.5l3.6-6.3a1.6 1.6 0 0 1 3 .9l-.6 3.9h4.8a2 2 0 0 1 2 2.4l-1.3 6.2a2 2 0 0 1-2 1.6H7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-down-thumb" viewBox="0 0 24 24"><g transform="rotate(180 12 12)"><path d="M7.5 10.5v9h-3v-9h3zM7.5 10.5l3.6-6.3a1.6 1.6 0 0 1 3 .9l-.6 3.9h4.8a2 2 0 0 1 2 2.4l-1.3 6.2a2 2 0 0 1-2 1.6H7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/><circle cx="9" cy="10" r="1.6" fill="currentColor"/><path d="M4 17l5-4.5 3.5 3 3-2.5 4.5 4" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></symbol>

      <symbol id="i-tab" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M3.5 9.5h17" fill="none" stroke="currentColor" stroke-width="1.75"/></symbol>

  </svg>

  <header class="top">
    <span class="status" id="status" role="status" title="Connecting…"></span>
    <span class="status-text" id="statusText"></span>
    <span class="grow"></span>
    <button class="icon-btn" id="btnNew" title="New chat" aria-label="New chat"><svg width="17" height="17"><use href="#i-plus"/></svg></button>
  </header>

  <main class="thread" id="thread" aria-live="polite">
    <div class="notice" id="offline" hidden>
      <strong>Bhai isn't running</strong>
      <p>Open the Bhai app on this computer. This panel connects by itself once it's open.</p>
      <button class="link-btn" id="btnRetry">Try again</button>
    </div>
    <section class="welcome" id="welcome">
      <div class="hello">
        <img src="icons/icon48.png" alt="">
        <h1 id="greeting">What should we do here?</h1>
        <p class="tip" id="tip"></p>
      </div>
      <div class="suggest" id="suggest"></div>
    </section>
  </main>

  <footer class="dock">
    <button class="jump" id="btnJump" hidden><svg width="13" height="13"><use href="#i-down"/></svg>Latest</button>
    <div class="pending" id="selChip" hidden>
      <svg width="15" height="15"><use href="#i-quote"/></svg>
      <span class="quote" id="selText"></span>
      <button class="link-btn" id="btnSelOff">Ignore</button>
    </div>
    <div class="pending" id="drawChip" hidden>
      <svg width="15" height="15"><use href="#i-pen"/></svg>
      <span class="quote">Your drawing goes with the next message</span>
      <button class="link-btn" id="btnDrawEdit">Edit</button>
      <button class="link-btn" id="btnDrawRemove">Remove</button>
    </div>
    <div class="hint" id="hint" role="alert"></div>
    <div class="composer">
      <div class="mention-menu" id="mentionMenu" role="listbox" hidden></div>
      <div class="sharing" id="sharing">
        <button class="share-head" id="shareHead" aria-expanded="false" aria-controls="shareList">
          <span class="favs" id="shareFavs"></span>
          <span class="share-label" id="shareLabel">Sharing this tab</span>
          <svg class="chev" width="14" height="14"><use href="#i-chev"/></svg>
        </button>
        <ul class="share-list" id="shareList" hidden></ul>
      </div>
      <div class="attachment" id="attachment" hidden>
        <img id="attachImg" alt="Image you pasted">
        <button class="icon-btn" id="btnAttachOff" title="Remove image" aria-label="Remove image"><svg width="12" height="12"><use href="#i-x"/></svg></button>
      </div>
      <textarea id="input" rows="1" placeholder="Ask Bhai, or type @ to add tabs" aria-label="Message Bhai"></textarea>
      <div class="tools">
        <button class="tool" id="btnDraw" title="Draw on the page to show Bhai what you mean" aria-label="Draw on the page"><svg width="16" height="16"><use href="#i-pen"/></svg></button>
        <button class="tool at" id="btnAt" title="Share another tab" aria-label="Share another tab">@</button>
        <button class="tool tabtoggle" id="tabToggle" aria-pressed="true"></button>
        <span class="grow"></span>
        <button class="send" id="btnSend" title="Send" aria-label="Send">
          <svg class="send-icon" width="16" height="16"><use href="#i-up"/></svg>
          <svg class="stop-icon" width="16" height="16"><use href="#i-stop"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
