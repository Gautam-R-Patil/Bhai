<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #080e1a;
      --surface: #0f1c2e;
      --surface2: #162032;
      --border: #1a2d44;
      --border2: #233554;
      --text: #e2eaf4;
      --text2: #7f9ab5;
      --text3: #3d5470;
      --blue: #3b82f6;
      --blue-dim: rgba(59,130,246,.12);
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --radius: 10px;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 12.5px;
      padding: 14px;
      line-height: 1.4;
    }

    /* ── Header ──────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 13px;
    }
    .logo {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1e3a5f, #1e40af);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      border: 1px solid #1e40af;
      flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-title { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -.2px; }
    .header-sub { font-size: 10px; color: var(--text3); margin-top: 1px; }

    /* Connection pill */
    .conn-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .4px;
      border: 1px solid transparent;
      transition: all .3s;
    }
    .conn-pill.connected    { background: rgba(34,197,94,.1); color: var(--green); border-color: rgba(34,197,94,.2); }
    .conn-pill.connecting   { background: rgba(245,158,11,.1); color: var(--yellow); border-color: rgba(245,158,11,.2); }
    .conn-pill.disconnected { background: rgba(239,68,68,.07); color: var(--red); border-color: rgba(239,68,68,.15); }
    .conn-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }
    .conn-pill.connecting .conn-dot { animation: blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Status Banner ────────────────────────── */
    .status-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
      min-height: 36px;
    }
    .status-icon { font-size: 13px; flex-shrink: 0; }
    .status-text { flex: 1; font-size: 11.5px; color: var(--text2); }
    .status-text .current-action { color: var(--text); font-weight: 500; }
    .status-spinner {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--border2);
      border-top-color: var(--blue);
      animation: spin .8s linear infinite;
      flex-shrink: 0; display: none;
    }
    .status-spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Page info ───────────────────────────── */
    .page-info {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .page-favicon { font-size: 11px; flex-shrink: 0; opacity: .7; }
    .page-url {
      font-size: 10.5px; color: var(--text3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .page-url .domain { color: var(--text2); }

    /* ── Tabs List ───────────────────────────── */
    .tabs-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 2px;
      max-height: 110px;
      overflow-y: auto;
    }
    .tabs-list:empty::after {
      content: 'No tabs visible';
      display: block; padding: 10px;
      font-size: 11px; color: var(--text3); text-align: center;
    }
    .tab-item {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 9px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .12s;
    }
    .tab-item:last-child { border-bottom: none; }
    .tab-item:hover { background: var(--surface2); }
    .tab-item.active { background: var(--blue-dim); border-left: 2px solid var(--blue); }
    .tab-idx { font-size: 9.5px; color: var(--text3); width: 14px; flex-shrink: 0; }
    .tab-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); flex-shrink: 0; opacity: 0; }
    .tab-item.active .tab-dot { opacity: 1; }
    .tab-title { flex: 1; font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-item.active .tab-title { color: var(--text); }
    .tab-url { font-size: 9.5px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }

    /* ── Action Log ──────────────────────────── */
    .section-label {
      font-size: 9.5px; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: .6px;
      margin-bottom: 5px; padding-left: 2px;
    }
    .action-log {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 10px;
    }
    .action-log:empty::after {
      content: 'No actions yet';
      display: block;
      padding: 12px;
      font-size: 11px;
      color: var(--text3);
      text-align: center;
    }
    .action-item {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      animation: slideIn .2s ease-out;
    }
    .action-item:last-child { border-bottom: none; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .action-icon { font-size: 11px; flex-shrink: 0; opacity: .8; }
    .action-text { flex: 1; font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .action-text .bold { color: var(--text); font-weight: 500; }
    .action-time { font-size: 9.5px; color: var(--text3); flex-shrink: 0; }

    /* ── Quick Message ────────────────────────── */
    .input-row {
      display: flex; gap: 5px;
      margin-bottom: 9px;
    }
    .input-row input {
      flex: 1;
      padding: 7px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color .2s;
    }
    .input-row input::placeholder { color: var(--text3); }
    .input-row input:focus { border-color: var(--blue); }
    .input-row input:disabled { opacity: .4; cursor: not-allowed; }

    .btn-send {
      padding: 7px 13px;
      background: var(--blue);
      color: #fff;
      border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-send:hover:not(:disabled) { background: #2563eb; }
    .btn-send:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; }

    /* ── Action Buttons ─────────────────────────── */
    .btn-row { display: flex; gap: 5px; margin-bottom: 9px; }
    .btn {
      flex: 1; padding: 7px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text2);
      font-size: 11px; font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn:hover:not(:disabled) { background: var(--surface2); color: var(--text); border-color: var(--border2); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn.danger { border-color: rgba(239,68,68,.3); color: #ef6060; }
    .btn.danger:hover:not(:disabled) { background: rgba(239,68,68,.08); }
    .btn.primary { background: var(--blue-dim); border-color: rgba(59,130,246,.3); color: #93c5fd; }
    .btn.primary:hover:not(:disabled) { background: rgba(59,130,246,.2); color: #bfdbfe; }

    /* ── Last Response ─────────────────────────── */
    .response-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--blue);
      border-radius: var(--radius);
      padding: 8px 10px;
      margin-bottom: 9px;
      display: none;
    }
    .response-card.visible { display: block; }
    .response-label { font-size: 9.5px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .response-text { font-size: 11px; color: var(--text2); line-height: 1.5; max-height: 54px; overflow: hidden; }

    /* ── Footer ─────────────────────────────────── */
    .footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .footer-version { font-size: 10px; color: var(--text3); }
    .btn-sm {
      padding: 3px 9px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text3);
      font-size: 10px;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-sm:hover { background: var(--surface2); color: var(--text2); }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">🤖</div>
    <div class="header-info">
      <div class="header-title">ATLAS Bridge</div>
      <div class="header-sub">AI Browser Agent</div>
    </div>
    <div class="conn-pill disconnected" id="connPill">
      <div class="conn-dot"></div>
      <span id="connLabel">Offline</span>
    </div>
  </div>

  <!-- Status / current action -->
  <div class="status-banner" id="statusBanner">
    <div class="status-icon" id="statusIcon">💤</div>
    <div class="status-text" id="statusText">Waiting for ATLAS&hellip;</div>
    <div class="status-spinner" id="statusSpinner"></div>
  </div>

  <!-- Open tabs -->
  <div class="section-label">Open Tabs</div>
  <div class="tabs-list" id="tabsList"></div>

  <!-- Action log -->
  <div class="section-label" style="margin-top:10px">Recent Actions</div>
  <div class="action-log" id="actionLog"></div>

  <!-- Quick message -->
  <div class="input-row">
    <input type="text" id="msgInput" placeholder="Send a message to ATLAS…" disabled />
    <button class="btn-send" id="btnSend" disabled>Send</button>
  </div>

  <!-- Buttons row -->
  <div class="btn-row">
    <button class="btn primary" id="btnPage" disabled>📄 Send page</button>
    <button class="btn" id="btnSel" disabled>✏️ Selection</button>
    <button class="btn danger" id="btnStop" disabled>⏹ Stop</button>
  </div>

  <!-- Last ATLAS response -->
  <div class="response-card" id="responseCard">
    <div class="response-label">ATLAS says</div>
    <div class="response-text" id="responseText"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-version">ATLAS v0.2.0</span>
    <button class="btn-sm" id="btnReconn">Reconnect</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
