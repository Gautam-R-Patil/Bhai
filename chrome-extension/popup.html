<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Bhai</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #fffaf5;
      --surface: #ffffff;
      --border: #f0e2d4;
      --text: #2a1d12;
      --text2: #7a6656;
      --accent: #e8762c;
      --accent-soft: rgba(232, 118, 44, .12);
      --green: #1f9d4c;
      --red: #d64545;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1410;
        --surface: #261c16;
        --border: #3a2b21;
        --text: #f5ebe2;
        --text2: #b09a88;
        --accent: #f08a45;
        --accent-soft: rgba(240, 138, 69, .16);
        --green: #46c873;
        --red: #ef6b6b;
      }
    }

    body {
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header { display: flex; align-items: center; gap: 10px; }
    .header img { width: 30px; height: 30px; border-radius: 8px; }
    .header-title { font-weight: 600; font-size: 15px; flex: 1; }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--text2); }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .pill.on { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
    .pill.off { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
    .hidden { display: none !important; }

    .offline p { color: var(--text2); margin: 4px 0 10px; }
    .offline strong { font-size: 13px; }

    .working { display: flex; align-items: center; gap: 10px; }
    .working-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .reply-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
    .reply { max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; }

    .ask { display: flex; gap: 8px; }
    .ask input { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; outline: none; }
    .ask input:focus { border-color: var(--accent); }

    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 8px 12px; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.small { padding: 5px 10px; font-size: 12px; }

    .quick { display: flex; gap: 8px; }
    .quick button { flex: 1; font-size: 12px; }

    .steps-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
    .steps { list-style: none; }
    .steps li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; color: var(--text2); font-size: 12px; }
    .steps li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .steps li span:last-child { flex: none; opacity: .7; }

    .footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text2); }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <div class="header-title">Bhai</div>
    <span class="pill" id="pill">Connecting…</span>
  </div>

  <!-- Shown when the Bhai app isn't reachable -->
  <div class="card offline hidden" id="offline">
    <strong>Bhai isn't running</strong>
    <p>Open the Bhai app on this computer. Chrome connects by itself once it's open.</p>
    <button class="small" id="btnRetry">Try again</button>
  </div>

  <!-- What Bhai is doing right now -->
  <div class="card working hidden" id="working">
    <div class="spinner"></div>
    <div class="working-text" id="workingText">Working…</div>
    <button class="small" id="btnStop">Stop</button>
  </div>

  <!-- Bhai's last reply -->
  <div class="card hidden" id="replyCard">
    <div class="reply-label">Bhai</div>
    <div class="reply" id="reply"></div>
  </div>

  <div class="ask">
    <input type="text" id="msgInput" placeholder="Ask Bhai to do something here…" autocomplete="off">
    <button class="primary" id="btnSend">Send</button>
  </div>

  <div class="quick">
    <button id="btnSummary" title="Sends this page to Bhai and asks for a summary">Summarize this page</button>
    <button id="btnExplain" title="Sends the text you selected and asks Bhai to explain it">Explain selection</button>
  </div>

  <div class="hidden" id="stepsBox">
    <div class="steps-label">What Bhai did</div>
    <ul class="steps" id="steps"></ul>
  </div>

  <div class="footer">
    <span id="version"></span>
    <span id="chatNote"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
