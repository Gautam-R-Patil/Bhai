<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    }

    .status-dot.connecting {
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
    }

    .status-label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Action Buttons ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: #1e3a5f;
      color: #93c5fd;
      border: 1px solid #1e40af;
    }

    .btn-primary:hover {
      background: #1e40af;
      color: #dbeafe;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .btn-secondary:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-icon {
      font-size: 14px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Message Input ── */
    .input-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .input-row input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input::placeholder {
      color: #475569;
    }

    .input-row input:focus {
      border-color: #3b82f6;
    }

    .btn-send {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .btn-send:hover {
      background: #2563eb;
    }

    .btn-send:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    /* ── Response Snippet ── */
    .response-area {
      background: #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
      max-height: 60px;
      overflow: hidden;
      display: none;
      margin-bottom: 10px;
      border-left: 2px solid #3b82f6;
    }

    .response-area.visible {
      display: block;
    }

    .response-label {
      font-size: 9px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .response-text {
      color: #cbd5e1;
      word-break: break-word;
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
    }

    .footer-text {
      font-size: 10px;
      color: #475569;
    }

    .btn-reconnect {
      font-size: 10px;
      padding: 3px 8px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-reconnect:hover {
      background: #1e293b;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="status-dot" id="statusDot"></div>
    <h1>ATLAS Bridge</h1>
    <span class="status-label" id="statusLabel">Offline</span>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button class="btn btn-primary" id="btnSendPage" disabled>
      <span class="btn-icon">&#128196;</span>
      Send page to ATLAS
    </button>
    <button class="btn btn-secondary" id="btnSendSelection" disabled>
      <span class="btn-icon">&#9997;</span>
      Send selection to ATLAS
    </button>
  </div>

  <!-- Message Input -->
  <div class="input-row">
    <input type="text" id="messageInput" placeholder="Quick message..." disabled />
    <button class="btn-send" id="btnSend" disabled>Send</button>
  </div>

  <!-- Last Response -->
  <div class="response-area" id="responseArea">
    <div class="response-label">Last response</div>
    <div class="response-text" id="responseText"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-text">ATLAS v0.2.0</span>
    <button class="btn-reconnect" id="btnReconnect">Reconnect</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
