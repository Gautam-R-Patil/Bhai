<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'none'; img-src 'self' data:; frame-ancestors 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Bhai — Admin Dashboard (decommissioned)</title>
    <meta http-equiv="refresh" content="3;url=https://admin.tryatlasagi.com/">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #f0f0f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px;
            text-align: center;
        }
        .card {
            max-width: 480px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }
        h1 { font-size: 20px; margin: 0 0 12px; }
        p { font-size: 14px; line-height: 1.6; color: rgba(255, 255, 255, 0.7); margin: 0 0 16px; }
        a { color: #818cf8; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <!--
        F9: this single-file admin dashboard is decommissioned in favour of
        portals/admin-panel (a Next.js app with proper auth, RBAC, route
        guards, and CSRF protection). The old HTML inlined user-supplied
        strings into the DOM and persisted the admin API key in
        sessionStorage — both unacceptable for an admin surface.

        Operators who reach this file at file:// or via a stale bookmark
        get redirected. If you need to grant access to a new admin, use
        the admin panel and the /api/admins/create flow.
    -->
    <div class="card">
        <h1>This dashboard has moved</h1>
        <p>The single-file admin dashboard is decommissioned. Use the new admin panel.</p>
        <p><a href="https://admin.tryatlasagi.com/">Open admin.tryatlasagi.com →</a></p>
        <p style="font-size: 12px; opacity: 0.5;">You will be redirected automatically in 3 seconds.</p>
    </div>
</body>
</html>
