  <script>
    (() => {
      const input = document.getElementById('input');
      const icon = document.getElementById('icon');
      if (window.BhaiMascot) window.BhaiMascot.mount(icon, 'idle');
      const progress = document.getElementById('progress');
      const contract = document.getElementById('contract');
      const replyBox = document.getElementById('reply-box');
      const replyText = document.getElementById('reply-text');
      const notifBox = document.getElementById('notification-box');
      const notifText = document.getElementById('notification-text');
      const widgetsBox = document.getElementById('widgets-container');
      const quickActionsBox = document.getElementById('quick-actions');
      const cardsBox = document.getElementById('interactive-cards');
      const blobs = [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3')];
      const srStatus = document.getElementById('sr-status');
      const taskDrawerToggle = document.getElementById('task-drawer-toggle');
      const taskDrawer = document.getElementById('task-drawer');
      const taskDrawerContent = document.getElementById('task-drawer-content');
      const taskCountBadge = document.getElementById('task-count-badge');
      const inboxPanel = document.getElementById('inbox-panel');
      const inboxList = document.getElementById('inbox-list');
      const inboxCountBadge = document.getElementById('inbox-count-badge');

      let ws = null, waiting = false, notifTimer = null;
      // One id per chat-bar session; the bot files the transcript under it
      // (the dashboard's Chats page). A fresh one starts after each close.
      const newChatId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      let chatId = newChatId();
      // Called by main.js after the bar hides: a reply that was already on
      // screen goes away (Bhai keeps the context); one still being worked on
      // stays, and so does one that arrives while hidden.
      // Idleness is decided when the hide starts, so a reply landing during the
      // close animation is kept for the next open instead of being wiped.
      let idleAtHide = false;
      window.noteHide = function () { idleAtHide = !waiting && !icon.classList.contains('thinking'); };
      window.resetChatIfIdle = function () {
        if (!idleAtHide) return false;
        replyBox.classList.remove('visible');
        replyText.innerHTML = '';
        progress.classList.remove('visible');
        progress.innerHTML = '';
        contract.textContent = '';
        clearInteractive();
        input.value = '';
        input.disabled = false;
        input.dispatchEvent(new Event('input'));
        chatId = newChatId();
        return true;
      };

      // ── Mascot mood: Bhai's face mirrors what the agent is doing ──
      const MOOD_LABELS = {
        idle: 'Bhai is idle', listening: 'Bhai is listening', thinking: 'Bhai is thinking',
        looking: 'Bhai is looking at your screen', working: 'Bhai is working on it',
        happy: 'Bhai is done', oops: 'Bhai hit a problem',
      };
      let moodTimer = null;
      function restingMood() {
        return !waiting && input.value.trim() ? 'listening' : 'idle';
      }
      function setMood(mood, holdMs) {
        clearTimeout(moodTimer);
        icon.dataset.mood = mood;
        icon.setAttribute('aria-label', MOOD_LABELS[mood] || MOOD_LABELS.idle);
        if (holdMs) moodTimer = setTimeout(() => setMood(restingMood()), holdMs);
      }
      // Progress lines are humanised tool updates ("📸 Looking at your screen…").
      function moodFromProgress(text) {
        const t = (text || '').toLowerCase();
        if (/📸|screen|screenshot|look|see|vision|brows|🌐|🔍|search|web|page|read/.test(t)) return 'looking';
        return 'working';
      }
      let activeTasks = new Map(); // taskId -> { name, type, progress, phase }
      let inboxItems = new Map();  // intentId -> wire item (status "pending" only)

      // ── Screen Reader Announcement ──
      function announceToSR(text) {
        srStatus.textContent = '';
        setTimeout(() => { srStatus.textContent = text; }, 50);
      }

      // ── ARIA Busy State ──
      const stopBtn = document.getElementById('stop-btn');
      function stopTask() {
        if (!waiting || !ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({ type: 'stop', chat: chatId }));
        progress.textContent = 'Stopping…';
      }
      stopBtn.addEventListener('click', stopTask);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && waiting) { e.preventDefault(); stopTask(); }
      });

      function setAgentBusy(busy) {
        stopBtn.hidden = !busy;
        replyBox.setAttribute('aria-busy', busy ? 'true' : 'false');
        if (busy) announceToSR('Bhai is processing your request');
      }

      // ── Task Drawer ──
      taskDrawerToggle.addEventListener('click', () => {
        const isOpen = taskDrawer.classList.toggle('open');
        taskDrawerToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });

      function updateTaskDrawer() {
        const count = activeTasks.size;
        taskCountBadge.textContent = String(count);
        taskCountBadge.classList.toggle('empty', count === 0);

        if (count === 0) {
          taskDrawerContent.innerHTML = '<div class="task-drawer-empty">No active tasks</div>';
          return;
        }

        let html = '';
        for (const [taskId, task] of activeTasks) {
          const iconChar = task.type === 'research' ? '🔬' : '⚡';
          const progressPct = task.progress != null ? Math.round(task.progress) : null;
          const detail = task.phase || (progressPct != null ? `${progressPct}%` : 'Running...');

          html += `<div class="task-item" role="listitem" aria-label="${task.name || 'Task'}: ${detail}">`;
          html += `  <span class="task-item-icon" aria-hidden="true">${iconChar}</span>`;
          html += `  <div class="task-item-body">`;
          html += `    <div class="task-item-name">${esc(task.name || 'Task ' + taskId)}</div>`;
          html += `    <div class="task-item-detail">${esc(detail)}</div>`;
          if (progressPct != null) {
            html += `    <div class="task-progress-bar" role="progressbar" aria-valuenow="${progressPct}" aria-valuemin="0" aria-valuemax="100">`;
            html += `      <div class="task-progress-fill" style="width:${progressPct}%"></div>`;
            html += `    </div>`;
          }
          html += `  </div>`;
          html += `  <button class="task-cancel-btn" aria-label="Cancel task: ${esc(task.name || taskId)}" onclick="cancelTask('${esc(taskId)}')">Cancel</button>`;
          html += `</div>`;
        }
        taskDrawerContent.innerHTML = html;
      }

      function cancelTask(taskId) {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'cancel_task', taskId }));
          activeTasks.delete(taskId);
          updateTaskDrawer();
          announceToSR('Task cancelled');
        }
      }
      window.cancelTask = cancelTask;

      // ── Inbox Panel (Task 4.2) ──
      function renderInbox() {
        const count = inboxItems.size;
        inboxCountBadge.textContent = String(count);
        if (count === 0) {
          inboxPanel.classList.remove('visible');
          inboxList.innerHTML = '';
          return;
        }
        inboxPanel.classList.add('visible');

        let html = '';
        for (const [id, item] of inboxItems) {
          const topic = item.topic || '(untitled)';
          const body = item.editedText || item.composedText || '';
          const evidence = Array.isArray(item.evidence) ? item.evidence : [];
          const safeId = esc(id);

          html += `<div class="inbox-item" data-inbox-id="${safeId}" role="listitem" aria-label="Inbox item: ${esc(topic)}">`;
          html += `  <div class="inbox-item-topic">${esc(topic)}</div>`;
          html += `  <div class="inbox-item-body">${esc(body)}</div>`;
          if (evidence.length > 0) {
            html += `  <div class="inbox-item-evidence">`;
            for (const e of evidence.slice(0, 4)) {
              html += `<div class="inbox-item-evidence-row"><span class="inbox-item-evidence-label">${esc(e.label || '')}:</span><span>${esc(e.value || '')}</span></div>`;
            }
            html += `  </div>`;
          }
          html += `  <div class="inbox-item-actions">`;
          html += `    <button class="inbox-action-btn approve" onclick="inboxApprove('${safeId}')">Approve</button>`;
          html += `    <button class="inbox-action-btn" onclick="inboxDefer('${safeId}')">Defer 3h</button>`;
          html += `    <button class="inbox-action-btn reject" onclick="inboxSkip('${safeId}')">Skip</button>`;
          html += `    <button class="inbox-action-btn" onclick="inboxToggleEdit('${safeId}')">Edit</button>`;
          html += `  </div>`;
          html += `  <div class="inbox-edit-row" id="edit-row-${safeId}">`;
          html += `    <input type="text" class="inbox-edit-input" id="edit-input-${safeId}" placeholder="Rewrite the draft…" value="${esc(body)}" />`;
          html += `    <button class="inbox-action-btn" onclick="inboxSubmitEdit('${safeId}')">Save</button>`;
          html += `  </div>`;
          html += `</div>`;
        }
        inboxList.innerHTML = html;
      }

      function inboxSend(obj) {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify(obj));
        }
      }
      function inboxApprove(id) {
        inboxSend({ type: 'inbox:approve', id });
        // Optimistic remove — server will also emit an updated event with non-pending status
        inboxItems.delete(id);
        renderInbox();
        announceToSR('Inbox item approved');
      }
      function inboxSkip(id) {
        inboxSend({ type: 'inbox:reject', id, reason: 'skipped from overlay' });
        inboxItems.delete(id);
        renderInbox();
        announceToSR('Inbox item skipped');
      }
      function inboxDefer(id) {
        inboxSend({ type: 'inbox:defer', id, inMs: 3 * 60 * 60 * 1000 });
        inboxItems.delete(id);
        renderInbox();
        announceToSR('Inbox item deferred 3 hours');
      }
      function inboxToggleEdit(id) {
        const row = document.getElementById('edit-row-' + id);
        if (!row) return;
        row.classList.toggle('visible');
        if (row.classList.contains('visible')) {
          const input = document.getElementById('edit-input-' + id);
          if (input) setTimeout(() => input.focus(), 0);
        }
      }
      function inboxSubmitEdit(id) {
        const input = document.getElementById('edit-input-' + id);
        if (!input) return;
        const newText = input.value.trim();
        if (!newText) return;
        inboxSend({ type: 'inbox:edit', id, newText });
        // Reflect locally immediately
        const it = inboxItems.get(id);
        if (it) { it.editedText = newText; inboxItems.set(id, it); renderInbox(); }
      }
      window.inboxApprove = inboxApprove;
      window.inboxSkip = inboxSkip;
      window.inboxDefer = inboxDefer;
      window.inboxToggleEdit = inboxToggleEdit;
      window.inboxSubmitEdit = inboxSubmitEdit;

      function grabFocus() {
        input.focus();
        setTimeout(() => input.focus(), 100);
        setTimeout(() => input.focus(), 300);
      }

      function connect() {
        // Authenticate the WS handshake with the server-injected loopback token.
        // The server rejects token-less connections (4001), which previously left
        // the overlay connected-but-mute. overlay-chat.ts injects the token two
        // ways: the %%ATLAS_LOCAL_TOKEN%% placeholder (→ window.__ATLAS_LOCAL_TOKEN__)
        // and window.__atlasLocalToken. Prefer either; fall back to token-less in
        // dev so the failure mode is visible, not silent.
        const _placeholder = window.__ATLAS_LOCAL_TOKEN__;
        const _tok = (_placeholder && _placeholder.indexOf('%%') === -1)
          ? _placeholder
          : (window.__atlasLocalToken || '');
        const qs = _tok ? `?localToken=${encodeURIComponent(_tok)}` : '';
        ws = new WebSocket(`ws://${location.host}${qs}`);
        window._atlasWS = ws; // Expose for Electron IPC (live voice shortcut)
        ws.onopen = () => { blobs.forEach(b => b.classList.add('on')); grabFocus(); };
        ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch (err) { console.error('[OVERLAY] handle() error:', err); } };
        ws.onclose = () => { blobs.forEach(b => b.classList.remove('on')); setTimeout(connect, 2000); };
        ws.onerror = () => ws.close();
      }

      // Clear all interactive elements (timers included)
      let activeTimers = [];
      function clearInteractive() {
        quickActionsBox.innerHTML = '';
        cardsBox.innerHTML = '';
        widgetsBox.innerHTML = '';
        activeTimers.forEach(clearInterval);
        activeTimers = [];
      }

      function handle(msg) {
        // Agent visibility control — hide overlay from screenshots, show after
        if (msg.type === 'agent_hide') {
          document.getElementById('container').style.opacity = '0';
          document.getElementById('container').style.pointerEvents = 'none';
          return;
        }
        if (msg.type === 'agent_show') {
          document.getElementById('container').style.opacity = '1';
          document.getElementById('container').style.pointerEvents = 'auto';
          return;
        }
        // ── Task drawer updates ──
        if (msg.type === 'task_progress') {
          const tid = msg.taskId || msg.id;
          if (tid) {
            activeTasks.set(tid, {
              name: msg.name || (activeTasks.get(tid) || {}).name || 'Task',
              type: msg.taskType || (activeTasks.get(tid) || {}).type || 'long_task',
              progress: msg.progress != null ? msg.progress : (activeTasks.get(tid) || {}).progress,
              phase: msg.phase || msg.status || (activeTasks.get(tid) || {}).phase,
            });
            updateTaskDrawer();
          }
          return;
        }
        if (msg.type === 'task_complete' || msg.type === 'task_cancelled') {
          const tid = msg.taskId || msg.id;
          if (tid) {
            const taskName = (activeTasks.get(tid) || {}).name || 'Task';
            activeTasks.delete(tid);
            updateTaskDrawer();
            announceToSR(msg.type === 'task_complete' ? `${taskName} completed` : `${taskName} cancelled`);
          }
          return;
        }
        if (msg.type === 'research_progress') {
          const rid = msg.taskId || msg.id || 'research';
          activeTasks.set(rid, {
            name: msg.topic || (activeTasks.get(rid) || {}).name || 'Research',
            type: 'research',
            progress: msg.progress != null ? msg.progress : (activeTasks.get(rid) || {}).progress,
            phase: msg.phase || msg.status || (activeTasks.get(rid) || {}).phase,
          });
          updateTaskDrawer();
          return;
        }

        // ── Inbox events (Task 4.2) ──
        if (msg.type === 'inbox:state') {
          inboxItems = new Map();
          const items = Array.isArray(msg.items) ? msg.items : [];
          for (const it of items) {
            if (it && it.id && it.status === 'pending') inboxItems.set(it.id, it);
          }
          renderInbox();
          return;
        }
        if (msg.type === 'inbox:item_added') {
          if (msg.item && msg.item.id) {
            inboxItems.set(msg.item.id, msg.item);
            renderInbox();
            announceToSR('New inbox item: ' + (msg.item.topic || ''));
          }
          return;
        }
        if (msg.type === 'inbox:item_updated') {
          if (msg.item && msg.item.id) {
            if (msg.item.status === 'pending') {
              inboxItems.set(msg.item.id, msg.item);
            } else {
              inboxItems.delete(msg.item.id);
            }
            renderInbox();
          }
          return;
        }
        if (msg.type === 'inbox:expired') {
          // Request fresh state rather than pruning locally
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'inbox:refresh' }));
          }
          return;
        }
        if (msg.type === 'inbox:error') {
          console.warn('[OVERLAY] inbox error:', msg.error, 'id:', msg.id);
          return;
        }

        if (msg.type === 'thinking') {
          icon.classList.add('thinking');
          setMood('thinking');
          setAgentBusy(true);
          replyBox.classList.remove('visible');
          progress.classList.remove('visible');
          progress.innerHTML = '';
          contract.textContent = ''; // a new turn: the last turn's contract no longer applies
          clearInteractive();
        }
        else if (msg.type === 'thinking_content') {
          // Live thinking display — show model reasoning as it arrives
          const thinkingText = (msg.text || '').trim();
          if (thinkingText) {
            const truncated = thinkingText.length > 600 ? thinkingText.substring(0, 600) + '...' : thinkingText;
            progress.innerHTML = `<div class="thinking-block"><div class="thinking-label">💭 thinking</div>${esc(truncated)}</div>`;
            progress.classList.add('visible');
          }
        }
        else if (msg.type === 'contract') {
          // Kept for the whole turn (cleared when the next one starts), unlike the progress card.
          contract.textContent = msg.text || '';
        }
        else if (msg.type === 'progress') {
          if (waiting || icon.classList.contains('thinking')) setMood(moodFromProgress(msg.text));
          // Render as enhanced progress card
          const progressIcon = extractProgressIcon(msg.text);
          const progressLabel = msg.text.startsWith(progressIcon) ? msg.text.slice(progressIcon.length).trimStart() : msg.text;
          progress.innerHTML = `<div class="progress-card"><span class="progress-icon">${progressIcon}</span><span class="progress-label">${esc(progressLabel)}</span><div class="progress-dots"><span></span><span></span><span></span></div></div>`;
          progress.classList.add('visible');
        }
        else if (msg.type === 'response' || msg.type === 'error') {
          icon.classList.remove('thinking');
          setMood(msg.type === 'error' ? 'oops' : 'happy', msg.type === 'error' ? 3200 : 1600);
          setAgentBusy(false);
          progress.classList.remove('visible');
          progress.innerHTML = '';

          if (msg.newChat) chatId = newChatId(); // "/new": later messages file under a fresh chat
          const rawText = msg.text || '(no response)';
          console.log('[OVERLAY] Response text length:', rawText.length, 'preview:', rawText.substring(0, 100));
          const renderedText = msg.type === 'error' ? `⚠️ ${esc(rawText)}` : renderMd(rawText);
          console.log('[OVERLAY] Rendered HTML length:', renderedText.length);
          replyText.innerHTML = renderedText;
          replyBox.classList.remove('visible');
          replyBox.offsetHeight;
          replyBox.classList.add('visible');
          input.value = '';
          input.disabled = false;
          waiting = false;
          announceToSR(msg.type === 'error' ? 'Error received from Bhai' : 'Response received from Bhai');

          // Render interactive elements
          clearInteractive();
          if (msg.widgets && msg.widgets.length > 0) {
            renderWidgets(msg.widgets);
          }
          if (msg.quickActions && msg.quickActions.length > 0) {
            renderQuickActions(msg.quickActions);
          }
          if ((msg.files && msg.files.length > 0) || (msg.links && msg.links.length > 0)) {
            renderCards(msg.files || [], msg.links || []);
          }

          grabFocus();
        }
        else if (msg.type === 'silent') {
          icon.classList.remove('thinking');
          setMood('idle');
          setAgentBusy(false);
          progress.classList.remove('visible');
          progress.innerHTML = '';
          replyBox.classList.remove('visible');
          clearInteractive();
          input.value = '';
          input.disabled = false;
          waiting = false;
          grabFocus();
        }
        else if (msg.type === 'image') {
          icon.classList.remove('thinking');
          setMood('happy', 1600);
          progress.classList.remove('visible');
          progress.innerHTML = '';
          let imgHtml = `<img src="${msg.url}" alt="Generated image" />`;
          if (msg.caption) imgHtml += `<div class="img-caption">${esc(msg.caption)}</div>`;
          replyText.innerHTML = imgHtml;
          replyBox.classList.remove('visible');
          replyBox.offsetHeight;
          replyBox.classList.add('visible');
        }
        else if (msg.type === 'placeholder') {
          input.placeholder = msg.text || 'Tell Bhai what needs sorting…';
        }
        else if (msg.type === 'notification') {
          if (notifTimer) { clearTimeout(notifTimer); notifTimer = null; }
          notifText.innerHTML = renderMd(msg.text);
          notifBox.classList.remove('visible', 'dismissing');
          notifBox.offsetHeight;
          notifBox.classList.add('visible');
          notifTimer = setTimeout(() => {
            notifBox.classList.add('dismissing');
            setTimeout(() => {
              notifBox.classList.remove('visible', 'dismissing');
              notifTimer = null;
            }, 400);
          }, 12000);
        }
        else if (msg.type === 'research_complete') {
          setMood('happy', 1600);
          // Remove research from task drawer
          const rid = msg.taskId || msg.id || 'research';
          activeTasks.delete(rid);
          updateTaskDrawer();
          announceToSR('Deep research completed');
          // Auto-show overlay window when research completes
          if (window.atlasOverlay && window.atlasOverlay.showWindow) {
            window.atlasOverlay.showWindow();
          }
          // Also send a native notification
          if (window.atlasOverlay && window.atlasOverlay.notify) {
            window.atlasOverlay.notify('Research Complete', msg.text || 'Your deep research has finished.');
          }
          // Show the result in the overlay as a persistent notification (no auto-dismiss)
          if (notifTimer) { clearTimeout(notifTimer); notifTimer = null; }
          notifText.innerHTML = renderMd(msg.text);
          notifBox.classList.remove('visible', 'dismissing');
          notifBox.offsetHeight;
          notifBox.classList.add('visible');
          // Don't auto-dismiss — user should see this and can dismiss manually
        }
        else if (msg.type === 'voice_result') {
          micBtn.classList.remove('listening');
          isListening = false;
          if (msg.text) {
            input.placeholder = 'Tell Bhai what needs sorting…';
            input.value = msg.text;
            send();
          } else {
            input.placeholder = 'Analyzing audio…';
            icon.classList.add('thinking');
            waiting = true;
            input.disabled = true;
          }
        }
        else if (msg.type === 'voice_status') {
          if (msg.status === 'listening') {
            micBtn.classList.add('listening');
            input.placeholder = 'Listening…';
          } else if (msg.status === 'processing') {
            micBtn.classList.remove('listening');
            input.placeholder = 'Analyzing audio…';
          } else if (msg.status === 'error') {
            micBtn.classList.remove('listening');
            isListening = false;
            input.placeholder = msg.error || 'Voice error';
            setTimeout(() => { input.placeholder = 'Tell Bhai what needs sorting…'; }, 2000);
          }
        }
        // ── Live Voice Mode status ──
        else if (msg.type === 'voice_live_status') {
          handleLiveVoiceStatus(msg);
        }
        else if (msg.type === 'voice_live_transcript') {
          handleLiveVoiceTranscript(msg);
        }
        else if (msg.type === 'voice_live_tool') {
          handleLiveVoiceTool(msg);
        }
      }

      // ── Widgets ──
      function renderWidgets(widgets) {
        widgetsBox.innerHTML = '';
        widgets.forEach(w => {
          if (w.type === 'clock') {
            const card = document.createElement('div');
            card.className = 'widget-card widget-clock';
            card.innerHTML = `
              <div class="widget-icon">⏱️</div>
              <div class="widget-content">
                <div class="widget-time" id="live-time"></div>
                <div class="widget-date" id="live-date"></div>
              </div>
            `;
            widgetsBox.appendChild(card);

            const timeEl = card.querySelector('#live-time');
            const dateEl = card.querySelector('#live-date');

            const updateClock = () => {
              const now = new Date();
              timeEl.textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
              dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            };

            updateClock();
            activeTimers.push(setInterval(updateClock, 1000));
          }
          // Placeholder for future weather widget
        });
      }

      // ── Quick Action Buttons ──
      function renderQuickActions(actions) {
        quickActionsBox.innerHTML = '';
        const DANGER_WORDS = ['delete', 'remove', 'destroy', 'drop', 'erase', 'nuke', 'wipe', 'uninstall'];
        const CONFIRM_WORDS = ['yes', 'confirm', 'approve', 'accept', 'proceed', 'go ahead', 'do it', 'ok'];

        actions.forEach(label => {
          const btn = document.createElement('button');
          btn.className = 'quick-action-btn';
          btn.textContent = label;
          const lower = label.toLowerCase();

          if (DANGER_WORDS.some(w => lower.includes(w))) btn.classList.add('danger');
          else if (CONFIRM_WORDS.some(w => lower.includes(w))) btn.classList.add('confirm');

          btn.onclick = () => {
            if (!ws || ws.readyState !== 1 || waiting) return;
            waiting = true;
            input.disabled = true;
            replyBox.classList.remove('visible');
            clearInteractive();
            ws.send(JSON.stringify({ type: 'quick_action', text: label, chat: chatId }));
          };
          quickActionsBox.appendChild(btn);
        });
      }

      // ── File & Link Cards ──
      function renderCards(files, links) {
        cardsBox.innerHTML = '';

        files.forEach(filePath => {
          const card = document.createElement('a');
          card.className = 'file-card';
          card.href = '#';
          const basename = filePath.split('/').pop() || filePath;
          const ext = basename.split('.').pop() || '';
          const icon = getFileIcon(ext);
          card.innerHTML = `<span class="card-icon">${icon}</span><span class="card-label" title="${esc(filePath)}">${esc(basename)}</span>`;
          card.onclick = (e) => {
            e.preventDefault();
            if (ws && ws.readyState === 1) {
              ws.send(JSON.stringify({ type: 'chat', text: `open ${filePath}`, chat: chatId }));
            }
          };
          cardsBox.appendChild(card);
        });

        links.forEach(url => {
          const card = document.createElement('a');
          card.className = 'link-card';
          card.href = url;
          card.target = '_blank';
          let domain = url;
          try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch { }
          card.innerHTML = `<span class="card-icon">🌐</span><span class="card-label" title="${esc(url)}">${esc(domain)}</span>`;
          cardsBox.appendChild(card);
        });
      }

      function getFileIcon(ext) {
        const icons = {
          'ts': '📜', 'js': '📜', 'tsx': '📜', 'jsx': '📜',
          'py': '🐍', 'rs': '⚙️', 'go': '⚙️',
          'html': '🌐', 'css': '🎨', 'scss': '🎨',
          'json': '📋', 'yaml': '📋', 'yml': '📋', 'toml': '📋',
          'md': '🗒️', 'txt': '🗒️',
          'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️', 'svg': '🖼️', 'gif': '🖼️',
          'pdf': '📄', 'doc': '📄', 'docx': '📄',
          'sh': '⌨️', 'bash': '⌨️', 'zsh': '⌨️',
        };
        return icons[ext.toLowerCase()] || '📁';
      }

      // ── Progress icon extraction ──
      function extractProgressIcon(text) {
        const match = text.match(/^([\p{Extended_Pictographic}\u200d\ufe0f]+)/u); // not \p{Emoji}: digits match it
        return match ? match[1] : '💭';
      }



      // Quotes too: model text ends up inside attributes (link hrefs).
      function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

      function renderMd(text) {
        let h = esc(text);
        // Code blocks with copy button
        h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => {
          const code = c.trim();
          const id = 'cb' + Math.random().toString(36).substr(2, 6);
          return `<div class="code-wrap"><button class="copy-btn" onclick="copyCode('${id}')">Copy</button><pre><code id="${id}">${code}</code></pre></div>`;
        });
        // Collapsible sections: <!--COLLAPSE:Title-->content<!--/COLLAPSE-->
        h = h.replace(/&lt;!--COLLAPSE:(.*?)--&gt;([\s\S]*?)&lt;!--\/COLLAPSE--&gt;/g, (_, title, content) => {
          const id = 'cl' + Math.random().toString(36).substr(2, 6);
          return `<div class="collapse-section" id="${id}"><div class="collapse-header" onclick="toggleCollapse('${id}')"><span class="collapse-arrow">▶</span>${title.trim()}</div><div class="collapse-body"><div class="collapse-content">${content.trim()}</div></div></div>`;
        });
        
        // Tables
        const tableRegex = /^\|(.+)\|\n\|([ \-\|:]+)\|\n((\|.*\|\n?)+)/gm;
        h = h.replace(tableRegex, (match, header, sep, body) => {
          const makeRow = (row, tag) => {
            const cols = row.trim().replace(/^\||\|$/g, '').split('|');
            return `<tr>${cols.map(c => `<${tag}>${c.trim()}</${tag}>`).join('')}</tr>`;
          };
          const thead = makeRow(header, 'th');
          const tbody = body.trim().split('\n').map(r => r.trim() ? makeRow(r, 'td') : '').join('');
          return `<div class="table-wrapper"><table class="md-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
        });

        h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        h = h.replace(/(?<!\w)\*([^*\n]+?)\*(?!\w)/g, '<em>$1</em>');
        // Only http(s) links — never javascript: or other schemes.
        h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, url) => /^https?:\/\//i.test(url) ? `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:#818cf8">${label}</a>` : label);
        h = h.replace(/^[\s]*[*\-]\s+/gm, '• ');
        h = h.replace(/\n/g, '<br>');
        return h;
      }

      function copyCode(id) {
        const el = document.getElementById(id);
        if (el) {
          navigator.clipboard.writeText(el.textContent || '');
          const btn = el.closest('.code-wrap')?.querySelector('.copy-btn');
          if (btn) { btn.textContent = '✓ Copied'; setTimeout(() => btn.textContent = 'Copy', 1500); }
        }
      }

      // ── Copy Response ──
      function copyResponse() {
        const text = replyText.textContent || replyText.innerText || '';
        navigator.clipboard.writeText(text);
        const btn = document.getElementById('copy-response-btn');
        if (btn) { btn.textContent = '✓'; setTimeout(() => btn.textContent = '⧉', 1500); }
      }

      // ── Toggle Collapsible Section ──
      function toggleCollapse(id) {
        const section = document.getElementById(id);
        if (section) section.classList.toggle('open');
      }

      // Make functions globally accessible
      window.copyCode = copyCode;
      window.copyResponse = copyResponse;
      window.toggleCollapse = toggleCollapse;

      // ── Notification Actions ──
      function replyToNotification() {
        dismissNotification();
        const notifContent = notifText.textContent || '';
        const preview = notifContent.substring(0, 40).trim();
        input.value = `Re: ${preview}… `;
        input.disabled = false;
        input.focus();
      }

      function dismissNotification() {
        if (notifTimer) { clearTimeout(notifTimer); notifTimer = null; }
        notifBox.classList.add('dismissing');
        setTimeout(() => { notifBox.classList.remove('visible', 'dismissing'); }, 300);
      }

      // ── Voice Input (via WebSocket → server-side recording) ──
      const micBtn = document.getElementById('mic-btn');
      let isListening = false;

      micBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!ws || ws.readyState !== 1) return;

        if (isListening) {
          ws.send(JSON.stringify({ type: 'voice_stop' }));
          isListening = false;
          micBtn.classList.remove('listening');
          input.placeholder = 'Processing…';
        } else {
          ws.send(JSON.stringify({ type: 'voice_start', chat: chatId }));
          isListening = true;
          micBtn.classList.add('listening');
          input.value = '';
          input.placeholder = 'Listening…';
        }
      });

      // ── Live Voice (continuous bidirectional) ──
      const lvPanel = document.getElementById('live-voice-panel');
      const lvStateText = document.getElementById('lv-state-text');
      const lvTimerEl = document.getElementById('lv-timer');
      const lvTranscript = document.getElementById('lv-transcript');
      const lvChips = document.getElementById('lv-chips');
      const lvOrb = document.getElementById('lv-orb');
      const lvMuteBtn = document.getElementById('lv-mute');
      const lvEndBtn = document.getElementById('lv-end');
      const liveBtn = document.getElementById('live-btn');

      let lvStartTs = 0;
      let lvTimerHandle = null;
      let lvActive = false;
      let lvStreamingAiTurn = null;  // the currently-streaming AI turn element
      const lvChipMap = new Map();    // id → chip element

      function lvFormatTime(ms) {
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      }

      function lvSetState(status, label) {
        const states = ['connecting', 'active', 'listening', 'speaking', 'thinking', 'interrupted', 'reconnecting', 'error', 'ended'];
        states.forEach(s => lvPanel.classList.remove('state-' + s));
        if (status) lvPanel.classList.add('state-' + status);
        if (label && lvStateText) lvStateText.textContent = label;
        announceToSR('Live voice: ' + (label || status));
      }

      function lvOpenPanel() {
        lvPanel.classList.remove('hidden');
        liveBtn.classList.add('active');
        liveBtn.setAttribute('aria-pressed', 'true');
        lvStartTs = Date.now();
        if (lvTimerHandle) clearInterval(lvTimerHandle);
        lvTimerHandle = setInterval(() => {
          lvTimerEl.textContent = lvFormatTime(Date.now() - lvStartTs);
        }, 1000);
        lvTimerEl.textContent = '0:00';
        lvActive = true;
        lvStartAmpMonitor();
      }

      function lvClosePanel() {
        lvPanel.classList.add('hidden');
        liveBtn.classList.remove('active');
        liveBtn.setAttribute('aria-pressed', 'false');
        if (lvTimerHandle) { clearInterval(lvTimerHandle); lvTimerHandle = null; }
        lvActive = false;
        lvStreamingAiTurn = null;
        lvTranscript.innerHTML = '';
        lvChips.innerHTML = '';
        lvChipMap.clear();
        lvMuteBtn.setAttribute('aria-pressed', 'false');
        lvMuteBtn.textContent = 'Mute';
        lvStopAmpMonitor();
      }

      // Assistant-streaming text from Gemini Live arrives as small DELTAS (per-chunk)
      // via `outputTranscription`. Append them instead of replacing the element body.
      function lvAppendAssistantDelta(delta) {
        if (!lvStreamingAiTurn) {
          const el = document.createElement('div');
          el.className = 'lv-turn turn-ai streaming';
          el.textContent = delta || '';
          lvTranscript.appendChild(el);
          lvStreamingAiTurn = el;
        } else {
          lvStreamingAiTurn.textContent += (delta || '');
        }
        lvTranscript.scrollTop = lvTranscript.scrollHeight;
      }

      function lvAppendUserTurn(text) {
        const el = document.createElement('div');
        el.className = 'lv-turn turn-user';
        el.textContent = text || '';
        lvTranscript.appendChild(el);
        lvTranscript.scrollTop = lvTranscript.scrollHeight;
      }

      function lvFinalizeAiTurn() {
        if (lvStreamingAiTurn) {
          lvStreamingAiTurn.classList.remove('streaming');
          lvStreamingAiTurn = null;
        }
      }

      function lvUpsertChip(id, name, state) {
        const key = id || name;
        let chip = lvChipMap.get(key);
        if (!chip) {
          chip = document.createElement('span');
          chip.className = 'lv-chip';
          chip.textContent = name;
          lvChips.appendChild(chip);
          lvChipMap.set(key, chip);
        }
        chip.className = 'lv-chip ' + (state || '');
        // Auto-prune resolved chips so a long session doesn't accumulate them.
        if (state === 'done' || state === 'failed') {
          setTimeout(() => {
            if (chip.parentNode === lvChips) lvChips.removeChild(chip);
            lvChipMap.delete(key);
          }, 8000);
        }
      }

      // Amp monitor disabled: WebKit inside the Swift overlay leaks the mic
      // indicator after track.stop() — the privacy HUD stays lit even though
      // we correctly release the stream, confusing users into thinking the
      // bot is still listening. The orb animates from state transitions
      // (listening/speaking/thinking CSS classes) instead of live amplitude.
      // If we want an audio-reactive orb later, feed amplitude from the bot
      // process over WebSocket — it already has the mic via sox.
      function lvStartAmpMonitor() { /* no-op */ }
      function lvStopAmpMonitor() {
        lvPanel.style.setProperty('--lv-amp', '0');
      }

      function handleLiveVoiceStatus(msg) {
        const s = msg.status;
        if (s === 'connecting') {
          lvOpenPanel();
          lvSetState('connecting', 'Connecting…');
        } else if (s === 'active') {
          // Turn completed naturally (not interrupted) — finalize any
          // streaming AI bubble so subsequent response_transcript events
          // start a new bubble instead of compounding onto this one.
          lvFinalizeAiTurn();
          lvSetState('listening', 'Listening');
        } else if (s === 'user_speaking') {
          // New user turn beginning — finalize any leftover AI bubble too.
          lvFinalizeAiTurn();
          lvSetState('listening', 'You’re talking');
        } else if (s === 'processing' || s === 'thinking') {
          lvSetState('thinking', 'Thinking');
        } else if (s === 'speaking') {
          lvSetState('speaking', 'Speaking');
        } else if (s === 'interrupted') {
          lvSetState('interrupted', 'Interrupted');
          lvFinalizeAiTurn();
          setTimeout(() => { if (lvActive) lvSetState('listening', 'Listening'); }, 400);
        } else if (s === 'reconnecting') {
          lvSetState('reconnecting', 'Reconnecting…');
        } else if (s === 'muted') {
          lvMuteBtn.setAttribute('aria-pressed', 'true');
          lvMuteBtn.textContent = 'Unmute';
          lvSetState('listening', 'Muted');
        } else if (s === 'unmuted') {
          lvMuteBtn.setAttribute('aria-pressed', 'false');
          lvMuteBtn.textContent = 'Mute';
          lvSetState('listening', 'Listening');
        } else if (s === 'ended') {
          lvFinalizeAiTurn();
          lvSetState('ended', 'Ended');
          setTimeout(() => lvClosePanel(), 600);
        } else if (s === 'already_active') {
          // Just make sure the panel is open
          if (!lvActive) { lvOpenPanel(); lvSetState('listening', 'Listening'); }
        } else if (s === 'error' || s === 'unavailable') {
          lvSetState('error', msg.error || 'Live voice unavailable');
          setTimeout(() => lvClosePanel(), 1800);
        }
      }

      function handleLiveVoiceTranscript(msg) {
        const role = msg.role === 'user' ? 'user' : 'assistant';
        const text = typeof msg.text === 'string' ? msg.text : '';
        if (!text) return;
        if (role === 'user') {
          lvAppendUserTurn(text);
          return;
        }
        // Assistant: final==false means this is a streaming delta; otherwise a
        // completed utterance (append as its own final turn).
        if (msg.final === false) {
          lvAppendAssistantDelta(text);
        } else {
          lvAppendAssistantDelta(text);
          lvFinalizeAiTurn();
        }
      }

      function handleLiveVoiceTool(msg) {
        if (!msg.id && !msg.name) return;
        if (!msg.id) return;
        const existing = lvChipMap.get(msg.id);
        // Fall back to "tool" rather than an empty label so an orphan
        // cancellation for a chip we never rendered is still intelligible.
        const label = msg.name || (existing ? existing.textContent : 'tool');
        lvUpsertChip(msg.id, label, msg.state || 'pending');
      }

      liveBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!ws || ws.readyState !== 1) return;
        if (lvActive) {
          ws.send(JSON.stringify({ type: 'voice_live_stop' }));
        } else {
          ws.send(JSON.stringify({ type: 'voice_live_start' }));
        }
      });

      lvMuteBtn.addEventListener('click', () => {
        if (!ws || ws.readyState !== 1 || !lvActive) return;
        const pressed = lvMuteBtn.getAttribute('aria-pressed') === 'true';
        ws.send(JSON.stringify({ type: pressed ? 'voice_live_unmute' : 'voice_live_mute' }));
      });

      lvEndBtn.addEventListener('click', () => {
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({ type: 'voice_live_stop' }));
      });

      // ── @ Mention Picker ──
      const picker = document.getElementById('mention-picker');
      const pickerList = document.getElementById('picker-list');
      const pickerSearch = document.getElementById('picker-search');
      const pickerPathBar = document.getElementById('picker-path-bar');
      const inputWrapper = document.getElementById('input-wrapper');
      const pickerPreview = document.getElementById('picker-preview');

      let pickerOpen = false;
      let activeTab = 'categories';
      let allTools = [];
      let allSkills = [];
      let currentDir = '/';
      let homeDir = '/';
      let browseCache = {};
      let pickerItems = [];
      let pickerSelectedIdx = -1;
      let mentionChips = []; // [{ type, name, value }]
      let mentionTriggerPos = -1; // caret pos when @ was typed

      // Fetch tools and home dir from server once
      async function loadMentionData() {
        try {
          const r = await fetch('/api/mentions');
          const d = await r.json();
          allTools = d.tools || [];
          allSkills = d.skills || [];
          homeDir = d.homeDir || '/';
          currentDir = homeDir;
        } catch { allTools = []; allSkills = []; }
      }
      loadMentionData();

      async function browseDir(dir) {
        if (browseCache[dir]) return browseCache[dir];
        try {
          const r = await fetch(`/api/browse?dir=${encodeURIComponent(dir)}`);
          const d = await r.json();
          browseCache[dir] = d.entries || [];
          return browseCache[dir];
        } catch { return []; }
      }

      function openPicker() {
        activeTab = 'categories';
        pickerOpen = true;
        picker.classList.add('open');
        input.setAttribute('aria-expanded', 'true');
        pickerSearch.value = '';
        pickerSelectedIdx = -1;
        renderPicker();
        // Focus search after a tick so it doesn't capture the @
        setTimeout(() => pickerSearch.focus(), 30);
      }

      function closePicker() {
        pickerOpen = false;
        picker.classList.remove('open');
        input.setAttribute('aria-expanded', 'false');
        pickerSelectedIdx = -1;
        input.focus();
      }

      async function renderPicker() {
        const query = pickerSearch.value.toLowerCase();
        pickerList.innerHTML = '';

        if (activeTab === 'categories') {
          pickerPathBar.style.display = 'none';
          const cats = [
            { id: 'tools', icon: '🔧', name: 'Tools', badge: 'category' },
            { id: 'files', icon: '📄', name: 'Files', badge: 'category' },
            { id: 'folders', icon: '📁', name: 'Folders', badge: 'category' },
            { id: 'skills', icon: '🧠', name: 'Skills', badge: 'category' }
          ].filter(c => !query || c.name.toLowerCase().includes(query));
          pickerItems = cats;
          if (cats.length === 0) {
            pickerList.innerHTML = '<div class="picker-empty">No categories found</div>';
            return;
          }
          cats.forEach((c, i) => {
            const el = makePicker(i, c.icon, c.name, c.badge, 'category');
            el.addEventListener('click', () => selectItem(i));
            pickerList.appendChild(el);
          });

        } else if (activeTab === 'tools') {
          pickerPathBar.style.display = 'block';
          pickerPathBar.textContent = '← Categories';
          const results = allTools.filter(t =>
            !query || t.name.toLowerCase().includes(query) || t.label.toLowerCase().includes(query)
          );
          pickerItems = results;
          if (results.length === 0) {
            pickerList.innerHTML = '<div class="picker-empty">No tools found</div>';
            return;
          }
          results.forEach((tool, i) => {
            const el = makePicker(i, '🔧', tool.label, tool.name.replace(/_/g, '-'), 'tool');
            el.addEventListener('click', () => selectItem(i));
            pickerList.appendChild(el);
          });

        } else if (activeTab === 'skills') {
          pickerPathBar.style.display = 'block';
          pickerPathBar.textContent = '← Categories';
          const results = allSkills.filter(s =>
            !query || s.name.toLowerCase().includes(query) || s.label.toLowerCase().includes(query)
          );
          pickerItems = results;
          if (results.length === 0) {
            pickerList.innerHTML = '<div class="picker-empty">No skills found</div>';
            return;
          }
          results.forEach((skill, i) => {
            const el = makePicker(i, '🧠', skill.name, 'skill', 'skill');
            el.addEventListener('click', () => selectItem(i));
            pickerList.appendChild(el);
          });

        } else {
          // Files or Folders
          pickerPathBar.style.display = 'block';
          pickerPathBar.textContent = `← ${currentDir === '/' || currentDir === '' ? 'Categories' : currentDir}`;
          const entries = await browseDir(currentDir);
          const filtered = entries.filter(e => {
            if (activeTab === 'folders' && !e.isDir) return false;
            return !query || e.name.toLowerCase().includes(query);
          });
          
          pickerItems = [];
          if (activeTab === 'folders' && !query) {
            const currentName = currentDir === '/' ? 'Root' : currentDir.split('/').pop() || 'Root';
            pickerItems.push({ isCurrent: true, name: currentName, path: currentDir });
            const currentEl = makePicker(0, '✅', `Choose current folder (${currentName})`, 'select', 'current', currentDir);
            currentEl.addEventListener('click', () => selectItem(0));
            pickerList.appendChild(currentEl);
          }
          
          if (filtered.length === 0 && pickerItems.length === 0) {
            pickerList.innerHTML = '<div class="picker-empty">Nothing here</div>';
            return;
          }
          
          filtered.forEach((entry) => {
            const idx = pickerItems.length;
            pickerItems.push(entry);
            const icon = entry.isDir ? '📁' : getFileIconChar(entry.name);
            const badge = entry.isDir ? 'dir' : entry.name.split('.').pop();
            const el = makePicker(idx, icon, entry.name, badge, entry.isDir ? 'dir' : 'file', entry.path);
            el.addEventListener('click', () => {
              if (entry.isDir) {
                // Navigate into dir
                currentDir = entry.path;
                pickerSearch.value = '';
                pickerSelectedIdx = -1;
                renderPicker();
                pickerSearch.focus();
              } else {
                selectItem(idx);
              }
            });
            pickerList.appendChild(el);
          });
        }
        highlightItem(pickerSelectedIdx);
      }

      function makePicker(idx, icon, name, badge, type, path) {
        const el = document.createElement('div');
        el.className = 'picker-item';
        el.dataset.idx = idx;
        el.innerHTML = `<span class="picker-item-icon">${icon}</span><span class="picker-item-name">${esc(name)}</span><span class="picker-item-badge">${esc(badge)}</span>`;
        return el;
      }

      function getFileIconChar(name) {
        const ext = name.split('.').pop().toLowerCase();
        const m = { ts: '📜', js: '📜', tsx: '📜', jsx: '📜', py: '🐍', md: '🗒️', json: '📋', yaml: '📋', yml: '📋', html: '🌐', css: '🎨', sh: '⌨️', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', svg: '🖼️', pdf: '📄' };
        return m[ext] || '📄';
      }

      function highlightItem(idx) {
        document.querySelectorAll('.picker-item').forEach((el, i) => {
          el.classList.toggle('selected', i === idx);
          if (i === idx) el.scrollIntoView({ block: 'nearest' });
        });

        // Preview images or videos
        const item = pickerItems[idx];
        if (item && !item.isDir && item.path) {
          const ext = (item.name || '').split('.').pop().toLowerCase();
          const isImage = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext);
          const isVideo = ['mp4', 'webm', 'mov'].includes(ext);
          
          if (isImage || isVideo) {
            const src = `/api/file?path=${encodeURIComponent(item.path)}`;
            pickerPreview.style.display = 'flex';
            if (isVideo) {
              pickerPreview.innerHTML = `<video src="${src}" autoplay loop muted style="max-width: 100%; max-height: 160px; border-radius: 8px;"></video>`;
            } else {
              pickerPreview.innerHTML = `<img src="${src}" style="max-width: 100%; max-height: 160px; border-radius: 8px; object-fit: contain;" />`;
            }
            return;
          }
        }
        
        pickerPreview.style.display = 'none';
        pickerPreview.innerHTML = '';
      }

      function selectItem(idx) {
        const item = pickerItems[idx];
        if (!item) return;

        if (activeTab === 'categories') {
          activeTab = item.id;
          pickerSearch.value = '';
          currentDir = homeDir;
          pickerSelectedIdx = -1;
          renderPicker();
          pickerSearch.focus();
          return;
        }

        if (item.isCurrent) {
          addChip('folder', item.name || '/', item.path);
          const val = input.value;
          if (mentionTriggerPos >= 0) input.value = val.substring(0, mentionTriggerPos);
          mentionTriggerPos = -1;
          closePicker();
          return;
        }

        if (item.isDir && (activeTab === 'files' || activeTab === 'folders')) {
          currentDir = item.path;
          pickerSearch.value = '';
          pickerSelectedIdx = -1;
          renderPicker();
          pickerSearch.focus();
          return;
        }

        let chipType, chipName, chipValue;
        if (activeTab === 'tools') {
          chipType = 'tool';
          chipName = item.label || item.name;
          chipValue = item.name;
        } else if (activeTab === 'skills') {
          chipType = 'skill';
          chipName = item.name;
          chipValue = item.name;
        } else if (activeTab === 'files') {
          chipType = 'file';
          chipName = item.name;
          chipValue = item.path || item.name;
        } else {
          chipType = 'folder';
          chipName = item.name;
          chipValue = item.path || item.name;
        }
        addChip(chipType, chipName, chipValue);
        // Remove the @ + any typed query from the input
        const val = input.value;
        if (mentionTriggerPos >= 0) {
          input.value = val.substring(0, mentionTriggerPos);
        }
        mentionTriggerPos = -1;
        closePicker();
      }

      function addChip(type, name, value) {
        const icons = { tool: '🔧', file: '📄', folder: '📁', skill: '🧠' };
        const chip = document.createElement('span');
        chip.className = 'mention-chip';
        chip.dataset.type = type;
        chip.dataset.value = value;
        chip.innerHTML = `${icons[type] || '@'} ${esc(name)}<span class="chip-remove" onclick="this.parentElement.remove()">×</span>`;
        // Insert before the input
        inputWrapper.insertBefore(chip, input);
        mentionChips = Array.from(inputWrapper.querySelectorAll('.mention-chip'));
      }

      // Build full message including chips as context
      function buildFullMessage() {
        const chips = Array.from(inputWrapper.querySelectorAll('.mention-chip'));
        const chipContext = chips.map(c => {
          const t = c.dataset.type, v = c.dataset.value;
          if (t === 'tool') return `[USE TOOL: ${v}]`;
          if (t === 'skill') return `[USE SKILL: ${v}]`;
          if (t === 'file') return `[FILE CONTEXT: ${v}]`;
          if (t === 'folder') return `[FOLDER CONTEXT: ${v}]`;
          return '';
        }).filter(Boolean).join(' ');
        const text = input.value.trim();
        return chipContext ? `${text}\n\n${chipContext}` : text;
      }

      // Picker search filter
      pickerSearch.addEventListener('input', () => renderPicker());

      // Picker keyboard nav
      pickerSearch.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closePicker(); return; }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          pickerSelectedIdx = Math.min(pickerSelectedIdx + 1, pickerItems.length - 1);
          highlightItem(pickerSelectedIdx);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          pickerSelectedIdx = Math.max(pickerSelectedIdx - 1, 0);
          highlightItem(pickerSelectedIdx);
        } else if (e.key === 'Enter' || e.key === 'Tab') {
          e.preventDefault();
          if (pickerSelectedIdx >= 0) selectItem(pickerSelectedIdx);
          else if (pickerItems.length > 0) selectItem(0);
        }
      });

      // Path bar click = go up one directory or back to categories
      pickerPathBar.addEventListener('click', () => {
        if (activeTab === 'tools' || activeTab === 'skills') {
          activeTab = 'categories';
          pickerSearch.value = '';
          renderPicker();
          return;
        }
        if (currentDir === '/' || currentDir === '') {
          activeTab = 'categories';
          pickerSearch.value = '';
          renderPicker();
          return;
        }
        const parts = currentDir.split('/').filter(Boolean);
        if (parts.length > 0) {
          parts.pop();
          currentDir = parts.length > 0 ? '/' + parts.join('/') : '/';
          pickerSearch.value = '';
          renderPicker();
        } else {
          activeTab = 'categories';
          pickerSearch.value = '';
          renderPicker();
        }
      });

      // Input @ detection
      input.addEventListener('input', (e) => {
        // Lean in while typing, but let a "done"/"oops" moment finish first.
        if (!waiting && icon.dataset.mood !== 'happy' && icon.dataset.mood !== 'oops') setMood(restingMood());
        const val = input.value;
        const pos = input.selectionStart || 0;
        // Find last @ before cursor
        const lastAt = val.lastIndexOf('@', pos - 1);
        if (lastAt >= 0 && (lastAt === 0 || /\s/.test(val[lastAt - 1]))) {
          const query = val.substring(lastAt + 1, pos);
          // Only open for short queries (not if user typed a long word that happens to have @)
          if (query.length <= 30 && !query.includes(' ')) {
            mentionTriggerPos = lastAt;
            if (!pickerOpen) openPicker();
            pickerSearch.value = query;
            renderPicker();
            return;
          }
        }
        if (pickerOpen) closePicker();
      });

      input.addEventListener('keydown', (e) => {
        if (pickerOpen) {
          if (e.key === 'Escape') { e.preventDefault(); closePicker(); return; }
          if (e.key === 'ArrowDown') { e.preventDefault(); pickerSelectedIdx = Math.min(pickerSelectedIdx + 1, pickerItems.length - 1); highlightItem(pickerSelectedIdx); return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); pickerSelectedIdx = Math.max(pickerSelectedIdx - 1, 0); highlightItem(pickerSelectedIdx); return; }
          if (e.key === 'Tab') { e.preventDefault(); if (pickerSelectedIdx >= 0) selectItem(pickerSelectedIdx); else if (pickerItems.length > 0) selectItem(0); return; }
        }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        // Backspace on empty input removes last chip
        if (e.key === 'Backspace' && input.value === '') {
          const chips = inputWrapper.querySelectorAll('.mention-chip');
          if (chips.length > 0) chips[chips.length - 1].remove();
        }
      });

      // Override send to include chip context
      function send() {
        const text = buildFullMessage();
        if (!text || !ws || ws.readyState !== 1 || waiting) return;
        waiting = true;
        input.disabled = true;
        setAgentBusy(true);
        announceToSR('Message sent, waiting for response');
        // Clear chips
        inputWrapper.querySelectorAll('.mention-chip').forEach(c => c.remove());
        replyBox.classList.remove('visible');
        progress.classList.remove('visible');
        progress.innerHTML = '';
        clearInteractive();
        ws.send(JSON.stringify({ type: 'chat', text, chat: chatId }));
      }

      // Click outside picker to close
      document.addEventListener('click', function (e) {
        if (pickerOpen && !picker.contains(e.target) && e.target !== input) {
          closePicker();
        }
        const a = e.target.closest('a');
        if (a && a.href) {
          e.preventDefault();
          e.stopPropagation();
          window.open(a.href, '_blank');
          return;
        }
        if (!pickerOpen) grabFocus();
      });

      // ── Drag & Drop ──
      const dropOverlay = document.getElementById('drop-overlay');
      let dragCounter = 0;

      document.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter++;
        dropOverlay.classList.add('active');
        dropOverlay.setAttribute('aria-hidden', 'false');
      }, false);

      document.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter <= 0) {
          dragCounter = 0;
          dropOverlay.classList.remove('active');
          dropOverlay.setAttribute('aria-hidden', 'true');
        }
      }, false);

      document.addEventListener('dragover', (e) => {
        e.preventDefault();
      }, false);

      document.addEventListener('drop', (e) => {
        e.preventDefault();
        dragCounter = 0;
        dropOverlay.classList.remove('active');
        dropOverlay.setAttribute('aria-hidden', 'true');

        const files = e.dataTransfer && e.dataTransfer.files;
        if (!files || files.length === 0 || !ws || ws.readyState !== 1 || waiting) return;

        const file = files[0];
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          // Extract base64 from data URL
          const base64 = dataUrl.split(',')[1];
          const mimeType = file.type || 'application/octet-stream';
          waiting = true;
          input.disabled = true;
          replyBox.classList.remove('visible');
          clearInteractive();
          ws.send(JSON.stringify({
            type: 'file_attach',
            name: file.name,
            base64,
            mimeType,
            text: '',
            chat: chatId,
          }));
        };
        reader.readAsDataURL(file);
      }, false);

      connect();
      grabFocus();
    })();
  </script>
</body>

</html>
