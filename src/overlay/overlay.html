        ws.send(JSON.stringify({ type: pressed ? 'voice_live_unmute' : 'voice_live_mute' }));
      });

      lvEndBtn.addEventListener('click', () => {
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({ type: 'voice_live_stop' }));
      });

      // ── @ Mention Picker ──
      const picker = document.getElementById('mention-picker');
      const pickerList = document.getElementById('picker-list');
      const pickerSearch = document.getElementById('picker-search');
      const pickerPathBar = document.getElementById('picker-path-bar');
      const inputWrapper = document.getElementById('input-wrapper');
      const pickerPreview = document.getElementById('picker-preview');

      let pickerOpen = false;
      let activeTab = 'categories';
      let allTools = [];
      let allSkills = [];
      let currentDir = '/';
      let homeDir = '/';
      let browseCache = {};
      let pickerItems = [];
      let pickerSelectedIdx = -1;
      let mentionChips = []; // [{ type, name, value }]
      let mentionTriggerPos = -1; // caret pos when @ was typed

      // Fetch tools and home dir from server once
      async function loadMentionData() {
        try {
          const r = await fetch('/api/mentions');
          const d = await r.json();
          allTools = d.tools || [];
          allSkills = d.skills || [];
          homeDir = d.homeDir || '/';
          currentDir = homeDir;
        } catch { allTools = []; allSkills = []; }
      }
      loadMentionData();

      async function browseDir(dir) {
        if (browseCache[dir]) return browseCache[dir];
        try {
          const r = await fetch(`/api/browse?dir=${encodeURIComponent(dir)}`);
          const d = await r.json();
          browseCache[dir] = d.entries || [];
          return browseCache[dir];
        } catch { return []; }
      }

      function openPicker() {
        activeTab = 'categories';
        pickerOpen = true;
        picker.classList.add('open');
        input.setAttribute('aria-expanded', 'true');
        pickerSearch.value = '';
        pickerSelectedIdx = -1;
        renderPicker();
        // Focus search after a tick so it doesn't capture the @
        setTimeout(() => pickerSearch.focus(), 30);
      }

      function closePicker() {
        pickerOpen = false;
        picker.classList.remove('open');
        input.setAttribute('aria-expanded', 'false');
        pickerSelectedIdx = -1;
        input.focus();
      }

      async function renderPicker() {
        const query = pickerSearch.value.toLowerCase();
        pickerList.innerHTML = '';

        if (activeTab === 'categories') {
          pickerPathBar.style.display = 'none';
          const cats = [
            { id: 'tools', icon: '🔧', name: 'Tools', badge: 'category' },
            { id: 'files', icon: '📄', name: 'Files', badge: 'category' },
            { id: 'folders', icon: '📁', name: 'Folders', badge: 'category' },
            { id: 'skills', icon: '🧠', name: 'Skills', badge: 'category' }
          ].filter(c => !query || c.name.toLowerCase().includes(query));
          pickerItems = cats;
          if (cats.length === 0) {
            pickerList.innerHTML = '<div class="picker-empty">No categories found</div>';
            return;
          }
          cats.forEach((c, i) => {
            const el = makePicker(i, c.icon, c.name, c.badge, 'category');
            el.addEventListener('click', () => selectItem(i));
            pickerList.appendChild(el);
          });

        } else if (activeTab === 'tools') {
          pickerPathBar.style.display = 'block';
          pickerPathBar.textContent = '← Categories';
          const results = allTools.filter(t =>
            !query || t.name.toLowerCase().includes(query) || t.label.toLowerCase().includes(query)
          );
          pickerItems = results;
          if (results.length === 0) {
            pickerList.innerHTML = '<div class="picker-empty">No tools found</div>';
            return;
          }
          results.forEach((tool, i) => {
            const el = makePicker(i, '🔧', tool.label, tool.name.replace(/_/g, '-'), 'tool');
            el.addEventListener('click', () => selectItem(i));
            pickerList.appendChild(el);
          });

        } else if (activeTab === 'skills') {
          pickerPathBar.style.display = 'block';
          pickerPathBar.textContent = '← Categories';
          const results = allSkills.filter(s =>
            !query || s.name.toLowerCase().includes(query) || s.label.toLowerCase().includes(query)
          );
          pickerItems = results;
          if (results.length === 0) {
            pickerList.innerHTML = '<div class="picker-empty">No skills found</div>';
            return;
          }
          results.forEach((skill, i) => {
            const el = makePicker(i, '🧠', skill.name, 'skill', 'skill');
            el.addEventListener('click', () => selectItem(i));
            pickerList.appendChild(el);
          });

        } else {
          // Files or Folders
          pickerPathBar.style.display = 'block';
          pickerPathBar.textContent = `← ${currentDir === '/' || currentDir === '' ? 'Categories' : currentDir}`;
          const entries = await browseDir(currentDir);
          const filtered = entries.filter(e => {
            if (activeTab === 'folders' && !e.isDir) return false;
            return !query || e.name.toLowerCase().includes(query);
          });
          
          pickerItems = [];
          if (activeTab === 'folders' && !query) {
            const currentName = currentDir === '/' ? 'Root' : currentDir.split('/').pop() || 'Root';
            pickerItems.push({ isCurrent: true, name: currentName, path: currentDir });
            const currentEl = makePicker(0, '✅', `Choose current folder (${currentName})`, 'select', 'current', currentDir);
            currentEl.addEventListener('click', () => selectItem(0));
            pickerList.appendChild(currentEl);
          }
          
          if (filtered.length === 0 && pickerItems.length === 0) {
            pickerList.innerHTML = '<div class="picker-empty">Nothing here</div>';
            return;
          }
          
          filtered.forEach((entry) => {
            const idx = pickerItems.length;
            pickerItems.push(entry);
            const icon = entry.isDir ? '📁' : getFileIconChar(entry.name);
            const badge = entry.isDir ? 'dir' : entry.name.split('.').pop();
            const el = makePicker(idx, icon, entry.name, badge, entry.isDir ? 'dir' : 'file', entry.path);
            el.addEventListener('click', () => {
              if (entry.isDir) {
                // Navigate into dir
                currentDir = entry.path;
                pickerSearch.value = '';
                pickerSelectedIdx = -1;
                renderPicker();
                pickerSearch.focus();
              } else {
                selectItem(idx);
              }
            });
            pickerList.appendChild(el);
          });
        }
        highlightItem(pickerSelectedIdx);
      }

      function makePicker(idx, icon, name, badge, type, path) {
        const el = document.createElement('div');
        el.className = 'picker-item';
        el.dataset.idx = idx;
        el.innerHTML = `<span class="picker-item-icon">${icon}</span><span class="picker-item-name">${esc(name)}</span><span class="picker-item-badge">${esc(badge)}</span>`;
        return el;
      }

      function getFileIconChar(name) {
        const ext = name.split('.').pop().toLowerCase();
        const m = { ts: '📜', js: '📜', tsx: '📜', jsx: '📜', py: '🐍', md: '🗒️', json: '📋', yaml: '📋', yml: '📋', html: '🌐', css: '🎨', sh: '⌨️', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', svg: '🖼️', pdf: '📄' };
        return m[ext] || '📄';
      }

      function highlightItem(idx) {
        document.querySelectorAll('.picker-item').forEach((el, i) => {
          el.classList.toggle('selected', i === idx);
          if (i === idx) el.scrollIntoView({ block: 'nearest' });
        });

        // Preview images or videos
        const item = pickerItems[idx];
        if (item && !item.isDir && item.path) {
          const ext = (item.name || '').split('.').pop().toLowerCase();
          const isImage = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext);
          const isVideo = ['mp4', 'webm', 'mov'].includes(ext);
          
          if (isImage || isVideo) {
            const src = `/api/file?path=${encodeURIComponent(item.path)}`;
            pickerPreview.style.display = 'flex';
            if (isVideo) {
              pickerPreview.innerHTML = `<video src="${src}" autoplay loop muted style="max-width: 100%; max-height: 160px; border-radius: 8px;"></video>`;
            } else {
              pickerPreview.innerHTML = `<img src="${src}" style="max-width: 100%; max-height: 160px; border-radius: 8px; object-fit: contain;" />`;
            }
            return;
          }
        }
        
        pickerPreview.style.display = 'none';
        pickerPreview.innerHTML = '';
      }

      function selectItem(idx) {
        const item = pickerItems[idx];
        if (!item) return;

        if (activeTab === 'categories') {
          activeTab = item.id;
          pickerSearch.value = '';
          currentDir = homeDir;
          pickerSelectedIdx = -1;
          renderPicker();
          pickerSearch.focus();
          return;
        }

        if (item.isCurrent) {
          addChip('folder', item.name || '/', item.path);
          const val = input.value;
          if (mentionTriggerPos >= 0) input.value = val.substring(0, mentionTriggerPos);
          mentionTriggerPos = -1;
          closePicker();
          return;
        }

        if (item.isDir && (activeTab === 'files' || activeTab === 'folders')) {
          currentDir = item.path;
          pickerSearch.value = '';
          pickerSelectedIdx = -1;
          renderPicker();
          pickerSearch.focus();
          return;
        }

        let chipType, chipName, chipValue;
        if (activeTab === 'tools') {
          chipType = 'tool';
          chipName = item.label || item.name;
          chipValue = item.name;
        } else if (activeTab === 'skills') {
          chipType = 'skill';
          chipName = item.name;
          chipValue = item.name;
        } else if (activeTab === 'files') {
          chipType = 'file';
          chipName = item.name;
          chipValue = item.path || item.name;
        } else {
          chipType = 'folder';
          chipName = item.name;
          chipValue = item.path || item.name;
        }
        addChip(chipType, chipName, chipValue);
        // Remove the @ + any typed query from the input
        const val = input.value;
        if (mentionTriggerPos >= 0) {
          input.value = val.substring(0, mentionTriggerPos);
        }
        mentionTriggerPos = -1;
        closePicker();
      }

      function addChip(type, name, value) {
        const icons = { tool: '🔧', file: '📄', folder: '📁', skill: '🧠' };
        const chip = document.createElement('span');
        chip.className = 'mention-chip';
        chip.dataset.type = type;
        chip.dataset.value = value;
        chip.innerHTML = `${icons[type] || '@'} ${esc(name)}<span class="chip-remove" onclick="this.parentElement.remove()">×</span>`;
        // Insert before the input
        inputWrapper.insertBefore(chip, input);
        mentionChips = Array.from(inputWrapper.querySelectorAll('.mention-chip'));
      }

      // Build full message including chips as context
      function buildFullMessage() {
        const chips = Array.from(inputWrapper.querySelectorAll('.mention-chip'));
        const chipContext = chips.map(c => {
          const t = c.dataset.type, v = c.dataset.value;
          if (t === 'tool') return `[USE TOOL: ${v}]`;
          if (t === 'skill') return `[USE SKILL: ${v}]`;
          if (t === 'file') return `[FILE CONTEXT: ${v}]`;
          if (t === 'folder') return `[FOLDER CONTEXT: ${v}]`;
          return '';
        }).filter(Boolean).join(' ');
        const text = input.value.trim();
        return chipContext ? `${text}\n\n${chipContext}` : text;
      }

      // Picker search filter
      pickerSearch.addEventListener('input', () => renderPicker());

      // Picker keyboard nav
      pickerSearch.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closePicker(); return; }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          pickerSelectedIdx = Math.min(pickerSelectedIdx + 1, pickerItems.length - 1);
          highlightItem(pickerSelectedIdx);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          pickerSelectedIdx = Math.max(pickerSelectedIdx - 1, 0);
          highlightItem(pickerSelectedIdx);
        } else if (e.key === 'Enter' || e.key === 'Tab') {
          e.preventDefault();
          if (pickerSelectedIdx >= 0) selectItem(pickerSelectedIdx);
          else if (pickerItems.length > 0) selectItem(0);
        }
      });

      // Path bar click = go up one directory or back to categories
      pickerPathBar.addEventListener('click', () => {
        if (activeTab === 'tools' || activeTab === 'skills') {
          activeTab = 'categories';
          pickerSearch.value = '';
          renderPicker();
          return;
        }
        if (currentDir === '/' || currentDir === '') {
          activeTab = 'categories';
          pickerSearch.value = '';
          renderPicker();
          return;
        }
        const parts = currentDir.split('/').filter(Boolean);
        if (parts.length > 0) {
          parts.pop();
          currentDir = parts.length > 0 ? '/' + parts.join('/') : '/';
          pickerSearch.value = '';
          renderPicker();
        } else {
          activeTab = 'categories';
          pickerSearch.value = '';
          renderPicker();
        }
      });

      // Input @ detection
      input.addEventListener('input', (e) => {
        const val = input.value;
        const pos = input.selectionStart || 0;
        // Find last @ before cursor
        const lastAt = val.lastIndexOf('@', pos - 1);
        if (lastAt >= 0 && (lastAt === 0 || /\s/.test(val[lastAt - 1]))) {
          const query = val.substring(lastAt + 1, pos);
          // Only open for short queries (not if user typed a long word that happens to have @)
          if (query.length <= 30 && !query.includes(' ')) {
            mentionTriggerPos = lastAt;
            if (!pickerOpen) openPicker();
            pickerSearch.value = query;
            renderPicker();
            return;
          }
        }
        if (pickerOpen) closePicker();
      });

      input.addEventListener('keydown', (e) => {
        if (pickerOpen) {
          if (e.key === 'Escape') { e.preventDefault(); closePicker(); return; }
          if (e.key === 'ArrowDown') { e.preventDefault(); pickerSelectedIdx = Math.min(pickerSelectedIdx + 1, pickerItems.length - 1); highlightItem(pickerSelectedIdx); return; }
          if (e.key === 'ArrowUp') { e.preventDefault(); pickerSelectedIdx = Math.max(pickerSelectedIdx - 1, 0); highlightItem(pickerSelectedIdx); return; }
          if (e.key === 'Tab') { e.preventDefault(); if (pickerSelectedIdx >= 0) selectItem(pickerSelectedIdx); else if (pickerItems.length > 0) selectItem(0); return; }
        }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        // Backspace on empty input removes last chip
        if (e.key === 'Backspace' && input.value === '') {
          const chips = inputWrapper.querySelectorAll('.mention-chip');
          if (chips.length > 0) chips[chips.length - 1].remove();
        }
      });

      // Override send to include chip context
      function send() {
        const text = buildFullMessage();
        if (!text || !ws || ws.readyState !== 1 || waiting) return;
        waiting = true;
        input.disabled = true;
        setAgentBusy(true);
        announceToSR('Message sent, waiting for response');
        // Clear chips
        inputWrapper.querySelectorAll('.mention-chip').forEach(c => c.remove());
        replyBox.classList.remove('visible');
        progress.classList.remove('visible');
        progress.innerHTML = '';
        clearInteractive();
        ws.send(JSON.stringify({ type: 'chat', text }));
      }

      // Click outside picker to close
      document.addEventListener('click', function (e) {
        if (pickerOpen && !picker.contains(e.target) && e.target !== input) {
          closePicker();
        }
        const a = e.target.closest('a');
        if (a && a.href) {
          e.preventDefault();
          e.stopPropagation();
          window.open(a.href, '_blank');
          return;
        }
        if (!pickerOpen) grabFocus();
      });

      // ── Drag & Drop ──
      const dropOverlay = document.getElementById('drop-overlay');
      let dragCounter = 0;

      document.addEventListener('dragenter', (e) => {
        e.preventDefault();
        dragCounter++;
        dropOverlay.classList.add('active');
        dropOverlay.setAttribute('aria-hidden', 'false');
      }, false);

      document.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dragCounter--;
        if (dragCounter <= 0) {
          dragCounter = 0;
          dropOverlay.classList.remove('active');
          dropOverlay.setAttribute('aria-hidden', 'true');
        }
      }, false);

      document.addEventListener('dragover', (e) => {
        e.preventDefault();
      }, false);

      document.addEventListener('drop', (e) => {
        e.preventDefault();
        dragCounter = 0;
        dropOverlay.classList.remove('active');
        dropOverlay.setAttribute('aria-hidden', 'true');

        const files = e.dataTransfer && e.dataTransfer.files;
        if (!files || files.length === 0 || !ws || ws.readyState !== 1 || waiting) return;

        const file = files[0];
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          // Extract base64 from data URL
          const base64 = dataUrl.split(',')[1];
          const mimeType = file.type || 'application/octet-stream';
          waiting = true;
          input.disabled = true;
          replyBox.classList.remove('visible');
          clearInteractive();
          ws.send(JSON.stringify({
            type: 'file_attach',
            name: file.name,
            base64,
            mimeType,
            text: '',
          }));
        };
        reader.readAsDataURL(file);
      }, false);

      connect();
      grabFocus();
    })();
  </script>
</body>

</html>
