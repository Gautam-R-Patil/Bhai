<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.T.L.A.S</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

    /* ──────────────────────────────────────────────
       Design tokens — mirror desktop/styles.css exactly so the overlay
       matches the dashboard chrome. Light is default (dashboard default);
       `body.theme-dark` overrides for the dark palette. Initial class is
       set from IPC or `prefers-color-scheme` before first paint.
       ────────────────────────────────────────────── */
    :root {
      /* LIGHT (matches desktop/styles.css root) */
      --bg-window:      #fefefe;
      --bg-panel:       rgba(255, 255, 255, 0.72);
      --bg-card:        rgba(255, 255, 255, 0.65);
      --bg-card-hover:  rgba(255, 255, 255, 0.85);
      --bg-input:       rgba(255, 255, 255, 0.5);
      --bg-input-focus: rgba(255, 255, 255, 0.9);
      --border:         rgba(0, 0, 0, 0.08);
      --border-strong:  rgba(0, 0, 0, 0.15);
      --text-primary:   #1d1d1f;
      --text-secondary: #515154;
      --text-muted:     #86868b;
      --accent:         #0066cc;
      --accent-hover:   #0055b3;
      --accent-soft:    rgba(0, 102, 204, 0.10);
      --accent-strong:  rgba(0, 102, 204, 0.22);
      --accent-glow:    rgba(0, 102, 204, 0.22);
      --success:        #34c759;
      --success-bg:     rgba(52, 199, 89, 0.12);
      --warning:        #ff9500;
      --warning-bg:     rgba(255, 149, 0, 0.12);
      --danger:         #ff3b30;
      --danger-bg:      rgba(255, 59, 48, 0.12);
      --info:           #0a84ff;
      --info-bg:        rgba(10, 132, 255, 0.12);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 22px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-card:  0 8px 32px rgba(0, 0, 0, 0.10), 0 1px 2px rgba(0, 0, 0, 0.04), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.16);
      color-scheme: light;
    }

    body.theme-dark {
      /* DARK (matches desktop/styles.css body.theme-dark) */
      --bg-window:      #1a1a1e;
      --bg-panel:       rgba(22, 22, 28, 0.78);
      --bg-card:        rgba(255, 255, 255, 0.05);
      --bg-card-hover:  rgba(255, 255, 255, 0.09);
      --bg-input:       rgba(255, 255, 255, 0.06);
      --bg-input-focus: rgba(255, 255, 255, 0.09);
      --border:         rgba(255, 255, 255, 0.10);
      --border-strong:  rgba(255, 255, 255, 0.18);
      --text-primary:   #f5f5f7;
      --text-secondary: rgba(245, 245, 247, 0.72);
      --text-muted:     rgba(245, 245, 247, 0.45);
      --accent:         #2997ff;
      --accent-hover:   #55adff;
      --accent-soft:    rgba(41, 151, 255, 0.14);
      --accent-strong:  rgba(41, 151, 255, 0.28);
      --accent-glow:    rgba(41, 151, 255, 0.30);
      --shadow-card:  0 16px 40px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv11", "ss01", "ss03";
      text-rendering: optimizeLegibility;
    }

    /* Global focus ring for keyboard a11y */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    #container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px;
    }

    /* ── Input Box ── */
    #input-box {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 12px;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(99, 102, 241, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 70%, rgba(129, 140, 248, 0.04) 0%, transparent 60%),
        var(--bg-panel);
      backdrop-filter: blur(80px) saturate(180%);
      -webkit-backdrop-filter: blur(80px) saturate(180%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      border-radius: var(--radius-xl);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease);
      animation: springIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }
    #input-box:focus-within {
      border-color: var(--accent);
      box-shadow: var(--shadow-card), 0 0 0 3px var(--accent-soft);
    }

    /* Apple spring-in: fast deceleration with tiny overshoot */
    @keyframes springIn {
      0% {
        opacity: 0;
        transform: scale(0.88) translateY(-8px);
      }

      60% {
        opacity: 1;
        transform: scale(1.015) translateY(0.5px);
      }

      80% {
        transform: scale(0.997) translateY(-0.3px);
      }

      100% {
        transform: scale(1) translateY(0);
      }
    }

    /* Apple spring-out: fast ease-in */
    @keyframes springOut {
      0% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }

      100% {
        opacity: 0;
        transform: scale(0.92) translateY(-6px);
      }
    }

    /* ── Advanced Liquid Mesh Gradients ── */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      /* Deep blur for seamless blending */
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(0.32, 0.72, 0, 1);
      pointer-events: none;
      mix-blend-mode: screen;
      /* Brighter, richer overlaps */
    }

    .blob.on {
      opacity: 0.65;
      /* Brighter ambient glow */
    }

    /* Indigo-family blobs — monochrome ambient glow, not a rainbow */
    .b1 {
      width: 140px;
      height: 140px;
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.45) 0%, rgba(99, 102, 241, 0.14) 50%, transparent 80%);
      top: -40px;
      left: -30px;
      animation: liq1 14s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    .b2 {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle at center, rgba(129, 140, 248, 0.35) 0%, rgba(99, 102, 241, 0.12) 50%, transparent 80%);
      top: -10px;
      right: -20px;
      animation: liq2 18s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate-reverse;
    }

    .b3 {
      width: 110px;
      height: 110px;
      background: radial-gradient(circle at center, rgba(59, 130, 246, 0.30) 0%, rgba(99, 102, 241, 0.10) 50%, transparent 80%);
      bottom: -40px;
      left: 30%;
      animation: liq3 15s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    /* Organic, overlapping orbital animations */
    @keyframes liq1 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }

      33% {
        transform: translate(15px, 10px) scale(1.1) rotate(10deg);
      }

      66% {
        transform: translate(-10px, 15px) scale(0.95) rotate(-5deg);
      }

      100% {
        transform: translate(5px, -10px) scale(1.05) rotate(5deg);
      }
    }

    @keyframes liq2 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }

      33% {
        transform: translate(-15px, 12px) scale(1.15) rotate(-10deg);
      }

      66% {
        transform: translate(12px, -8px) scale(0.9) rotate(8deg);
      }

      100% {
        transform: translate(-8px, -15px) scale(1.05) rotate(-5deg);
      }
    }

    @keyframes liq3 {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }

      33% {
        transform: translate(20px, -15px) scale(0.9) rotate(15deg);
      }

      66% {
        transform: translate(-15px, -20px) scale(1.1) rotate(-10deg);
      }

      100% {
        transform: translate(-5px, 10px) scale(1.05) rotate(5deg);
      }
    }

    /* ── Icon (Sparkle) — single-hue indigo sphere, no rainbow ── */
    .icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%,
        rgba(241, 243, 255, 0.9) 0%,
        rgba(165, 180, 252, 0.78) 26%,
        var(--accent) 62%,
        var(--accent-hover) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      box-shadow:
        0 4px 16px var(--accent-glow),
        0 0 36px rgba(99, 102, 241, 0.15),
        inset 0 2px 4px rgba(255, 255, 255, 0.28),
        inset 0 -2px 4px rgba(55, 48, 163, 0.35);
      transition: box-shadow 0.4s var(--ease), transform 0.4s var(--ease), background 0.4s var(--ease);
      position: relative;
      z-index: 1;
    }

    .icon.thinking {
      transform: scale(1.08);
      box-shadow:
        0 4px 24px rgba(245, 158, 11, 0.4),
        0 0 36px rgba(245, 158, 11, 0.15),
        inset 0 2px 4px rgba(255, 255, 255, 0.3),
        inset 0 -2px 4px rgba(120, 53, 15, 0.35);
      background: radial-gradient(circle at 30% 28%,
        rgba(255, 251, 235, 0.9) 0%,
        rgba(253, 224, 71, 0.78) 26%,
        var(--warning) 62%,
        #92400e 100%);
      animation: iconBreath 1.1s ease-in-out infinite;
    }

    @keyframes iconBreath {
      0%, 100% { transform: scale(1.08); }
      50%      { transform: scale(1.15); }
    }

    /* ── Input ── */
    #input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 400;
      caret-color: var(--accent);
      letter-spacing: -0.01em;
      transition: opacity 0.3s var(--ease);
      position: relative;
      z-index: 1;
    }

    #input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    #input:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* ── Reply Bubble ── */
    #reply-box {
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(99, 102, 241, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 70%, rgba(59, 130, 246, 0.04) 0%, transparent 60%),
        var(--bg-panel);
      backdrop-filter: blur(80px) saturate(180%);
      -webkit-backdrop-filter: blur(80px) saturate(180%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      border-radius: var(--radius-xl);
      padding: 16px 18px;
      font-size: 13.5px;
      line-height: 1.55;
      letter-spacing: -0.005em;
      color: var(--text-primary);
      position: relative;
      overflow: hidden;
      display: none;
      flex-shrink: 0;
      max-height: 300px;
      overflow-y: auto;
    }

    #reply-box.visible {
      display: block;
      animation: bubbleSpring 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.08);
    }

    /* Spring bubble — fast in, gentle overshoot, settle */
    @keyframes bubbleSpring {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(-4px);
      }

      55% {
        opacity: 1;
        transform: scale(1.02) translateY(0.5px);
      }

      75% {
        transform: scale(0.995) translateY(-0.2px);
      }

      100% {
        transform: scale(1) translateY(0);
      }
    }

    /* Liquid shimmer sweep across bubble */
    #reply-box::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg,
          transparent 0%,
          rgba(255, 255, 255, 0.03) 35%,
          rgba(255, 255, 255, 0.06) 50%,
          rgba(255, 255, 255, 0.03) 65%,
          transparent 100%);
      animation: glassSweep 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
      pointer-events: none;
    }

    @keyframes glassSweep {
      0% {
        transform: translateX(-100%);
        opacity: 1;
      }

      100% {
        transform: translateX(100%);
        opacity: 0;
      }
    }

    /* Reply blob (ambient inner glow) */
    .reply-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(35px);
      pointer-events: none;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle at center, rgba(59, 130, 246, 0.25) 0%, rgba(129, 140, 248, 0.1) 50%, transparent 80%);
      bottom: -30px;
      right: -20px;
      animation: liq2 15s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      mix-blend-mode: screen;
    }

    #reply-text {
      position: relative;
      z-index: 1;
      color: var(--text-primary);
      text-wrap: pretty;
      font-variant-numeric: tabular-nums;
    }

    #reply-text code {
      background: var(--accent-soft);
      color: #c7d2fe;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Geist Mono', 'SF Mono', ui-monospace, monospace;
      font-size: 12.5px;
    }

    #reply-text pre {
      background: rgba(10, 10, 26, 0.6);
      padding: 12px 14px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: 'Geist Mono', 'SF Mono', ui-monospace, monospace;
      font-size: 12.5px;
      line-height: 1.55;
      border: 1px solid var(--border);
    }

    #reply-text pre code {
      background: none;
      color: rgba(255, 255, 255, 0.92);
      padding: 0;
    }

    #reply-text strong {
      color: var(--accent-hover);
      font-weight: 600;
    }

    #reply-text img {
      max-width: 100%;
      border-radius: 10px;
      margin: 6px 0;
      display: block;
    }

    #reply-text .img-caption {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 2px;
    }

    /* Progress */
    #progress {
      display: none;
      padding: 0 2px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      font-style: italic;
      transition: opacity 0.3s;
    }

    #progress.visible {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* ── Notification Banner ── */
    #notification-box {
      display: none;
      background: var(--bg-panel);
      backdrop-filter: blur(80px) saturate(180%);
      -webkit-backdrop-filter: blur(80px) saturate(180%);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 14px 18px;
      font-size: 13.5px;
      line-height: 1.55;
      letter-spacing: -0.005em;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      max-height: 200px;
      overflow-y: auto;
    }

    #notification-box.visible {
      display: block;
      animation: notifSlideIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }

    #notification-box.dismissing {
      animation: notifFadeOut 0.4s ease forwards;
    }

    @keyframes notifSlideIn {
      0% {
        opacity: 0;
        transform: translateY(-10px) scale(0.92);
      }

      60% {
        opacity: 1;
        transform: translateY(1px) scale(1.01);
      }

      100% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes notifFadeOut {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-6px) scale(0.95);
      }
    }

    #notification-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #818cf8;
      margin-bottom: 6px;
    }

    #notification-text {
      color: rgba(255, 255, 255, 0.85);
    }

    /* ── Notification Actions ── */
    .notif-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .notif-action-btn {
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #FFF;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s cubic-bezier(0.32, 0.72, 0, 1);
      font-family: inherit;
    }

    .notif-action-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .notif-action-btn.dismiss {
      color: rgba(255, 255, 255, 0.55);
      background: transparent;
    }

    .notif-action-btn.dismiss:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.9);
    }

    /* ── Mic Button ── */
    #mic-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      margin-right: -2px;
      border-radius: 8px;
      transition: color 180ms var(--ease),
                  background 180ms var(--ease),
                  transform 180ms var(--ease);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    #mic-btn:hover {
      color: var(--text-primary);
      background: var(--bg-card);
    }
    #mic-btn:active { transform: scale(0.94); }

    #mic-btn.listening {
      color: var(--accent);
      background: var(--accent-soft);
    }

    #mic-btn.listening svg {
      filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6));
    }

    #mic-btn svg {
      transition: filter 0.3s ease;
    }

    /* ── Code Block Copy Button ── */
    .code-wrap {
      position: relative;
    }

    .code-wrap pre {
      margin: 0;
    }

    .copy-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    /* ── Quick Action Buttons ── */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      animation: fadeSlideIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.08);
    }

    .quick-action-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 400;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      letter-spacing: -0.01em;
    }

    .quick-action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      color: #FFF;
      transform: scale(1.02);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .quick-action-btn:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    .quick-action-btn.danger {
      border-color: rgba(255, 59, 48, 0.4);
      /* iOS Red */
      background: rgba(255, 59, 48, 0.1);
      color: #ff6b6b;
    }

    .quick-action-btn.danger:hover {
      background: rgba(255, 59, 48, 0.2);
      border-color: rgba(255, 59, 48, 0.6);
      color: #ff8787;
      box-shadow: 0 4px 12px rgba(255, 59, 48, 0.2);
    }

    .quick-action-btn.confirm {
      border-color: rgba(52, 199, 89, 0.4);
      /* iOS Green */
      background: rgba(52, 199, 89, 0.1);
      color: #69db7c;
    }

    .quick-action-btn.confirm:hover {
      background: rgba(52, 199, 89, 0.2);
      border-color: rgba(52, 199, 89, 0.6);
      color: #8ce99a;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.2);
    }

    /* ── Widgets (Clock, Weather, etc.) ── */
    #widgets-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
    }

    .widget-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      color: #FFF;
      letter-spacing: -0.01em;
    }

    .widget-icon {
      font-size: 32px;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.2));
    }

    /* Clock Widget Specifics */
    .widget-clock .widget-time {
      font-size: 28px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      margin-bottom: 2px;
    }

    .widget-clock .widget-date {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
    }

    /* ── File / Link Cards ── */
    .interactive-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      animation: fadeSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.08);
    }

    .file-card,
    .link-card {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px;
      color: #FFF;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      text-decoration: none;
      max-width: 260px;
      overflow: hidden;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .file-card:hover,
    .link-card:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
      transform: scale(1.015);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .card-icon {
      font-size: 13px;
      flex-shrink: 0;
    }

    .card-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Tables ── */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
    }

    .md-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    .md-table th {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 600;
      color: #FFF;
      white-space: nowrap;
    }

    .md-table td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.85);
      vertical-align: top;
    }

    .md-table tr:last-child td {
      border-bottom: none;
    }

    /* ── Collapsible Sections ── */
    .collapse-section {
      margin: 6px 0;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .collapse-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      transition: background 0.2s cubic-bezier(0.32, 0.72, 0, 1);
      user-select: none;
    }

    .collapse-header:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .collapse-arrow {
      font-size: 9px;
      transition: transform 0.2s;
      color: rgba(255, 255, 255, 0.4);
    }

    .collapse-section.open .collapse-arrow {
      transform: rotate(90deg);
    }

    .collapse-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .collapse-section.open .collapse-body {
      max-height: 500px;
      overflow-y: auto;
    }

    .collapse-body::-webkit-scrollbar {
      width: 6px;
    }
    .collapse-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .collapse-content {
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.75);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* ── Copy Response Button ── */
    .copy-response-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      opacity: 0;
      z-index: 2;
    }

    #reply-box:hover .copy-response-btn {
      opacity: 1;
    }

    .copy-response-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
    }

    /* ── Enhanced Progress Card ── */
    .progress-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(28, 28, 30, 0.72);
      backdrop-filter: blur(80px) saturate(200%);
      -webkit-backdrop-filter: blur(80px) saturate(200%);
      border-radius: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      animation: fadeSlideIn 0.3s ease;
    }

    .progress-icon {
      font-size: 14px;
      animation: progressPulse 1.5s ease-in-out infinite;
    }

    .progress-label {
      flex: 1;
      font-style: italic;
    }

    .progress-dots {
      display: flex;
      gap: 3px;
    }

    /* ── Live Thinking Block ── */
    .thinking-block {
      padding: 10px 14px;
      background: rgba(99, 102, 241, 0.08);
      border-left: 2px solid rgba(99, 102, 241, 0.4);
      border-radius: 8px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.55);
      font-style: italic;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      animation: fadeSlideIn 0.3s ease;
      scrollbar-width: thin;
      scrollbar-color: rgba(99, 102, 241, 0.3) transparent;
    }
    .thinking-block::-webkit-scrollbar { width: 4px; }
    .thinking-block::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 2px; }
    .thinking-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(99, 102, 241, 0.6);
      margin-bottom: 4px;
      font-style: normal;
    }

    .progress-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(124, 106, 255, 0.6);
      animation: dotBounce 1.4s ease-in-out infinite;
    }

    .progress-dots span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .progress-dots span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes fadeSlideIn {
      0% {
        opacity: 0;
        transform: translateY(4px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes progressPulse {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes dotBounce {

      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.4;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ── Drag & Drop Overlay ── */
    #drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(10, 10, 14, 0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 2px dashed rgba(99, 102, 241, 0.5);
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    }

    #drop-overlay.active {
      opacity: 1;
      pointer-events: all;
      animation: dropBorderPulse 1.8s ease-in-out infinite;
    }

    @keyframes dropBorderPulse {

      0%,
      100% {
        border-color: rgba(99, 102, 241, 0.4);
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
      }

      50% {
        border-color: rgba(99, 102, 241, 0.9);
        box-shadow: 0 0 24px 4px rgba(99, 102, 241, 0.15);
      }
    }

    .drop-icon {
      font-size: 42px;
      animation: dropIconFloat 2s ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(99, 102, 241, 0.5));
    }

    @keyframes dropIconFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .drop-label {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: -0.01em;
    }

    .drop-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.38);
      letter-spacing: 0.01em;
    }

    /* ── @ Mention Picker (Moved Outside Input Box) ── */
    #mention-picker {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: rgba(18, 18, 22, 0.92);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(99, 102, 241, 0.15);
      overflow: hidden;
      opacity: 0;
      transform: translateY(-6px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.1);
      z-index: 200;
      max-height: 320px;
      display: flex;
      flex-direction: column;
    }

    #mention-picker.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    .picker-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      flex-shrink: 0;
    }

    .picker-tab {
      flex: 1;
      padding: 9px 0;
      font-size: 11.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      transition: color 0.15s, background 0.15s;
    }

    .picker-tab.active {
      color: #6366f1;
      background: rgba(99, 102, 241, 0.08);
    }

    .picker-tab:hover:not(.active) {
      color: rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.04);
    }

    .picker-search-wrap {
      padding: 10px 12px 6px;
      flex-shrink: 0;
    }

    #picker-search {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #FFF;
      font-family: inherit;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    #picker-search:focus {
      border-color: rgba(99, 102, 241, 0.5);
    }

    #picker-search::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .picker-list {
      overflow-y: auto;
      flex: 1;
      padding: 4px 0 8px;
    }

    .picker-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.82);
      transition: background 0.12s;
      border-radius: 0;
      letter-spacing: -0.01em;
    }

    .picker-item:hover,
    .picker-item.selected {
      background: rgba(99, 102, 241, 0.12);
      color: #FFF;
    }

    .picker-item.selected {
      background: rgba(99, 102, 241, 0.18);
    }

    .picker-item-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .picker-item-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .picker-item-badge {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    #picker-preview img,
    #picker-preview video {
      max-width: 100%;
      height: auto;
      max-height: 160px;
      border-radius: 6px;
      object-fit: contain;
    }

    .picker-empty {
      text-align: center;
      padding: 24px;
      color: rgba(255, 255, 255, 0.25);
      font-size: 13px;
      font-style: italic;
    }

    .picker-path-bar {
      padding: 6px 12px 2px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }

    .picker-path-bar:hover {
      color: rgba(255, 255, 255, 0.6);
    }

    /* ── Mention Chips (in input) ── */
    .mentions-wrapper {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      min-height: 28px;
      position: relative;
      z-index: 1;
    }

    .mention-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: rgba(200, 160, 255, 1);
      border-radius: 6px;
      padding: 2px 8px 2px 6px;
      font-size: 12.5px;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: default;
      animation: chipPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2);
    }

    @keyframes chipPop {
      0% {
        transform: scale(0.7);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .chip-remove {
      cursor: pointer;
      opacity: 0.5;
      font-size: 11px;
      line-height: 1;
      transition: opacity 0.15s;
      margin-left: 2px;
    }

    .chip-remove:hover {
      opacity: 1;
    }

    /* ── Screen Reader Only (visually hidden) ── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Flex-row input wrapper */
    .input-inner {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    #input-wrapper {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    /* ── Task Drawer ── */
    #task-drawer-toggle {
      appearance: none;
      border: none;
      background: rgba(28, 28, 30, 0.7);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 500;
      font-family: inherit;
      padding: 4px 12px;
      border-radius: 0 0 10px 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 0 auto;
      position: relative;
      z-index: 5;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: none;
    }

    #task-drawer-toggle:hover {
      background: rgba(28, 28, 30, 0.85);
      color: rgba(255, 255, 255, 0.8);
    }

    #task-drawer-toggle .task-count-badge {
      background: rgba(99, 102, 241, 0.6);
      color: #FFF;
      font-size: 9px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 8px;
      min-width: 14px;
      text-align: center;
    }

    #task-drawer-toggle .task-count-badge.empty {
      background: rgba(255, 255, 255, 0.15);
    }

    #task-drawer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
      background: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(80px) saturate(220%) brightness(1.1);
      -webkit-backdrop-filter: blur(80px) saturate(220%) brightness(1.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      margin-bottom: 4px;
    }

    #task-drawer.open {
      max-height: 260px;
      overflow-y: auto;
    }

    .task-drawer-content {
      padding: 10px 14px;
    }

    .task-drawer-empty {
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      text-align: center;
      padding: 16px 0;
      font-style: italic;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-item-icon {
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .task-item-body {
      flex: 1;
      min-width: 0;
    }

    .task-item-name {
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-item-detail {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 2px;
    }

    .task-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }

    .task-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #818cf8, #6366f1);
      border-radius: 2px;
      transition: width 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .task-cancel-btn {
      appearance: none;
      border: 1px solid rgba(255, 59, 48, 0.3);
      background: rgba(255, 59, 48, 0.08);
      color: rgba(255, 100, 100, 0.7);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.15s;
    }

    .task-cancel-btn:hover {
      background: rgba(255, 59, 48, 0.2);
      color: #ff8787;
      border-color: rgba(255, 59, 48, 0.5);
    }

    /* ── Inbox Panel (Task 4.2) ── */
    #inbox-panel {
      display: none;
      background: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(80px) saturate(220%) brightness(1.1);
      -webkit-backdrop-filter: blur(80px) saturate(220%) brightness(1.1);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      margin-bottom: 4px;
      padding: 8px 12px 10px 12px;
      max-height: 300px;
      overflow-y: auto;
    }

    #inbox-panel.visible {
      display: block;
    }

    .inbox-header {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 0 6px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inbox-header .inbox-count-badge {
      background: rgba(59, 130, 246, 0.6);
      color: #FFF;
      font-size: 9px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 8px;
      min-width: 16px;
      text-align: center;
    }

    .inbox-item {
      padding: 8px 0 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .inbox-item:last-child {
      border-bottom: none;
    }

    .inbox-item-topic {
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 3px;
    }

    .inbox-item-body {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.4;
      margin-bottom: 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .inbox-item-evidence {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.45);
      margin: 3px 0 6px 0;
      line-height: 1.3;
    }

    .inbox-item-evidence-row {
      display: flex;
      gap: 6px;
    }

    .inbox-item-evidence-label {
      color: rgba(255, 255, 255, 0.35);
      flex-shrink: 0;
    }

    .inbox-item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }

    .inbox-action-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.8);
      font-size: 10.5px;
      padding: 3px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .inbox-action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #FFF;
    }

    .inbox-action-btn.approve {
      border-color: rgba(52, 199, 89, 0.45);
      background: rgba(52, 199, 89, 0.1);
      color: rgba(120, 230, 150, 0.95);
    }

    .inbox-action-btn.approve:hover {
      background: rgba(52, 199, 89, 0.25);
      color: #8ff0a5;
    }

    /* ── Animations ── */

      100% { opacity: 1; transform: translateY(0)    scale(1);    }
    }
    @keyframes lvBubbleIn {
      0%   { opacity: 0; transform: translateY(6px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0)   scale(1);    }

    @keyframes lvDotBreath {
      0%, 100% { opacity: 0.55; transform: scale(1);   }
      50%      { opacity: 1;    transform: scale(1.2); }
    }
    @keyframes lvRingPulse {
      0%   { transform: scale(0.85); opacity: 0.6; }
      100% { transform: scale(2.2);  opacity: 0;   }
    }
    @keyframes lvOrbBreath {
      0%, 100% { transform: scale(calc(1   + var(--lv-amp, 0) * 0.35)); }

    @keyframes lvOrbSpin {
      0%   { filter: hue-rotate(0deg)   brightness(1);   }
      50%  { filter: hue-rotate(15deg)  brightness(1.08); }
      100% { filter: hue-rotate(360deg) brightness(1);   }

    @keyframes lvOrbFlash {
      0%, 100% { filter: brightness(1)   saturate(1);   }
      50%      { filter: brightness(1.5) saturate(1.6); }
    }
    @keyframes lvCaret {
      0%, 50%   { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>

  <script>
    // ── Theme bootstrap ────────────────────────────────────────
    // The overlay mirrors the dashboard's light/dark choice. Sources, in order:
    //   1. `atlasOverlay.getTheme()` — user's persisted choice from electron-store
    //   2. `prefers-color-scheme` — OS-level preference
    // The chosen palette is applied BEFORE first paint so there's no flash.
    (function bootstrapTheme() {
      const applyResolved = (pref) => {
        const wantDark = pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.body.classList.toggle('theme-dark', wantDark);
        document.body.classList.toggle('theme-light', !wantDark);
      };

      // Paint-first guess from OS media query (no flash while IPC resolves)
      applyResolved('system');

      // Resolve the authoritative choice via IPC if available
      if (window.atlasOverlay?.getTheme) {
        window.atlasOverlay.getTheme()
          .then(applyResolved)
          .catch(() => { /* fall back to prefers-color-scheme guess */ });
      }

      // Live-update when the user toggles the menu item
      if (window.atlasOverlay?.onThemeChanged) {
        window.atlasOverlay.onThemeChanged(applyResolved);
      }

      // If they're on "system" and the OS toggles during a session, follow along
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (window.atlasOverlay?.getTheme) {
          window.atlasOverlay.getTheme().then((pref) => {
            if (pref === 'system') applyResolved('system');
          });
        } else {
          applyResolved('system');
        }
      });
    })();
  </script>

  <script>
    (() => {
      const input = document.getElementById('input');
      const icon = document.getElementById('icon');
      const progress = document.getElementById('progress');
      const replyBox = document.getElementById('reply-box');
      const replyText = document.getElementById('reply-text');
      const notifBox = document.getElementById('notification-box');
      const notifText = document.getElementById('notification-text');
      const widgetsBox = document.getElementById('widgets-container');
      const quickActionsBox = document.getElementById('quick-actions');
      const cardsBox = document.getElementById('interactive-cards');
      const blobs = [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3')];
      const srStatus = document.getElementById('sr-status');
      const taskDrawerToggle = document.getElementById('task-drawer-toggle');
      const taskDrawer = document.getElementById('task-drawer');
      const taskDrawerContent = document.getElementById('task-drawer-content');
      const taskCountBadge = document.getElementById('task-count-badge');
      const inboxPanel = document.getElementById('inbox-panel');
      const inboxList = document.getElementById('inbox-list');
      const inboxCountBadge = document.getElementById('inbox-count-badge');

      let ws = null, waiting = false, notifTimer = null;
      let activeTasks = new Map(); // taskId -> { name, type, progress, phase }
      let inboxItems = new Map();  // intentId -> wire item (status "pending" only)

      // ── Screen Reader Announcement ──
      function announceToSR(text) {
        srStatus.textContent = '';
        setTimeout(() => { srStatus.textContent = text; }, 50);
      }

      // ── ARIA Busy State ──
      function setAgentBusy(busy) {
        replyBox.setAttribute('aria-busy', busy ? 'true' : 'false');
        icon.setAttribute('aria-label', busy ? 'Agent status: processing' : 'Agent status: idle');
        if (busy) announceToSR('A.T.L.A.S is processing your request');
      }

      // ── Task Drawer ──
      taskDrawerToggle.addEventListener('click', () => {
        const isOpen = taskDrawer.classList.toggle('open');
        taskDrawerToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });

      function updateTaskDrawer() {
        const count = activeTasks.size;
        taskCountBadge.textContent = String(count);
        taskCountBadge.classList.toggle('empty', count === 0);

        if (count === 0) {
          taskDrawerContent.innerHTML = '<div class="task-drawer-empty">No active tasks</div>';
          return;
        }

        let html = '';
        for (const [taskId, task] of activeTasks) {
          const iconChar = task.type === 'research' ? '🔬' : '⚡';
          const progressPct = task.progress != null ? Math.round(task.progress) : null;
          const detail = task.phase || (progressPct != null ? `${progressPct}%` : 'Running...');

          html += `<div class="task-item" role="listitem" aria-label="${task.name || 'Task'}: ${detail}">`;
          html += `  <span class="task-item-icon" aria-hidden="true">${iconChar}</span>`;
          html += `  <div class="task-item-body">`;
          html += `    <div class="task-item-name">${esc(task.name || 'Task ' + taskId)}</div>`;
          html += `    <div class="task-item-detail">${esc(detail)}</div>`;
          if (progressPct != null) {
            html += `    <div class="task-progress-bar" role="progressbar" aria-valuenow="${progressPct}" aria-valuemin="0" aria-valuemax="100">`;
            html += `      <div class="task-progress-fill" style="width:${progressPct}%"></div>`;
            html += `    </div>`;
          }
          html += `  </div>`;
          html += `  <button class="task-cancel-btn" aria-label="Cancel task: ${esc(task.name || taskId)}" onclick="cancelTask('${esc(taskId)}')">Cancel</button>`;
          html += `</div>`;
        }
        taskDrawerContent.innerHTML = html;
      }

      function cancelTask(taskId) {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'cancel_task', taskId }));
          activeTasks.delete(taskId);
          updateTaskDrawer();
          announceToSR('Task cancelled');
        }
      }
      window.cancelTask = cancelTask;

      // ── Inbox Panel (Task 4.2) ──
      function renderInbox() {
        const count = inboxItems.size;
        inboxCountBadge.textContent = String(count);
        if (count === 0) {
          inboxPanel.classList.remove('visible');
          inboxList.innerHTML = '';
          return;
        }
        inboxPanel.classList.add('visible');

        let html = '';
        for (const [id, item] of inboxItems) {
          const topic = item.topic || '(untitled)';
          const body = item.editedText || item.composedText || '';
          const evidence = Array.isArray(item.evidence) ? item.evidence : [];
          const safeId = esc(id);

          html += `<div class="inbox-item" data-inbox-id="${safeId}" role="listitem" aria-label="Inbox item: ${esc(topic)}">`;
          html += `  <div class="inbox-item-topic">${esc(topic)}</div>`;
          html += `  <div class="inbox-item-body">${esc(body)}</div>`;
          if (evidence.length > 0) {
            html += `  <div class="inbox-item-evidence">`;
            for (const e of evidence.slice(0, 4)) {
              html += `<div class="inbox-item-evidence-row"><span class="inbox-item-evidence-label">${esc(e.label || '')}:</span><span>${esc(e.value || '')}</span></div>`;
            }
            html += `  </div>`;
          }
          html += `  <div class="inbox-item-actions">`;
          html += `    <button class="inbox-action-btn approve" onclick="inboxApprove('${safeId}')">Approve</button>`;
          html += `    <button class="inbox-action-btn" onclick="inboxDefer('${safeId}')">Defer 3h</button>`;
          html += `    <button class="inbox-action-btn reject" onclick="inboxSkip('${safeId}')">Skip</button>`;
          html += `    <button class="inbox-action-btn" onclick="inboxToggleEdit('${safeId}')">Edit</button>`;
          html += `  </div>`;
          html += `  <div class="inbox-edit-row" id="edit-row-${safeId}">`;
          html += `    <input type="text" class="inbox-edit-input" id="edit-input-${safeId}" placeholder="Rewrite the draft…" value="${esc(body)}" />`;
          html += `    <button class="inbox-action-btn" onclick="inboxSubmitEdit('${safeId}')">Save</button>`;
          html += `  </div>`;
          html += `</div>`;
        }
        inboxList.innerHTML = html;
      }

      function inboxSend(obj) {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify(obj));
        }
      }
      function inboxApprove(id) {
        inboxSend({ type: 'inbox:approve', id });
        // Optimistic remove — server will also emit an updated event with non-pending status
        inboxItems.delete(id);
        renderInbox();
        announceToSR('Inbox item approved');
      }
      function inboxSkip(id) {
        inboxSend({ type: 'inbox:reject', id, reason: 'skipped from overlay' });
        inboxItems.delete(id);
        renderInbox();
        announceToSR('Inbox item skipped');
      }
      function inboxDefer(id) {
        inboxSend({ type: 'inbox:defer', id, inMs: 3 * 60 * 60 * 1000 });
        inboxItems.delete(id);
        renderInbox();
        announceToSR('Inbox item deferred 3 hours');
      }
      function inboxToggleEdit(id) {
        const row = document.getElementById('edit-row-' + id);
        if (!row) return;
        row.classList.toggle('visible');
        if (row.classList.contains('visible')) {
          const input = document.getElementById('edit-input-' + id);
          if (input) setTimeout(() => input.focus(), 0);
        }
      }
      function inboxSubmitEdit(id) {
        const input = document.getElementById('edit-input-' + id);
        if (!input) return;
        const newText = input.value.trim();
        if (!newText) return;
        inboxSend({ type: 'inbox:edit', id, newText });
        // Reflect locally immediately
        const it = inboxItems.get(id);
        if (it) { it.editedText = newText; inboxItems.set(id, it); renderInbox(); }
      }
      window.inboxApprove = inboxApprove;
      window.inboxSkip = inboxSkip;
      window.inboxDefer = inboxDefer;
      window.inboxToggleEdit = inboxToggleEdit;
      window.inboxSubmitEdit = inboxSubmitEdit;

      function grabFocus() {
        input.focus();
        setTimeout(() => input.focus(), 100);
        setTimeout(() => input.focus(), 300);
      }

      function connect() {
        ws = new WebSocket(`ws://${location.host}`);
        window._atlasWS = ws; // Expose for Electron IPC (live voice shortcut)
        ws.onopen = () => { blobs.forEach(b => b.classList.add('on')); grabFocus(); };
        ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch (err) { console.error('[OVERLAY] handle() error:', err); } };
        ws.onclose = () => { blobs.forEach(b => b.classList.remove('on')); setTimeout(connect, 2000); };
        ws.onerror = () => ws.close();
      }

      // Clear all interactive elements (timers included)
      let activeTimers = [];
      function clearInteractive() {
        quickActionsBox.innerHTML = '';
        cardsBox.innerHTML = '';
        widgetsBox.innerHTML = '';
        activeTimers.forEach(clearInterval);
        activeTimers = [];
      }

      function handle(msg) {
        // Agent visibility control — hide overlay from screenshots, show after
        if (msg.type === 'agent_hide') {
          document.getElementById('container').style.opacity = '0';
          document.getElementById('container').style.pointerEvents = 'none';
          return;
        }
        if (msg.type === 'agent_show') {
          document.getElementById('container').style.opacity = '1';
          document.getElementById('container').style.pointerEvents = 'auto';
          return;
        }
        // ── Task drawer updates ──
        if (msg.type === 'task_progress') {
          const tid = msg.taskId || msg.id;
          if (tid) {
            activeTasks.set(tid, {
              name: msg.name || (activeTasks.get(tid) || {}).name || 'Task',
              type: msg.taskType || (activeTasks.get(tid) || {}).type || 'long_task',
              progress: msg.progress != null ? msg.progress : (activeTasks.get(tid) || {}).progress,
              phase: msg.phase || msg.status || (activeTasks.get(tid) || {}).phase,
            });
            updateTaskDrawer();
          }
          return;
        }
        if (msg.type === 'task_complete' || msg.type === 'task_cancelled') {
          const tid = msg.taskId || msg.id;
          if (tid) {
            const taskName = (activeTasks.get(tid) || {}).name || 'Task';
            activeTasks.delete(tid);
            updateTaskDrawer();
            announceToSR(msg.type === 'task_complete' ? `${taskName} completed` : `${taskName} cancelled`);
          }
          return;
        }
        if (msg.type === 'research_progress') {
          const rid = msg.taskId || msg.id || 'research';
          activeTasks.set(rid, {
            name: msg.topic || (activeTasks.get(rid) || {}).name || 'Research',
            type: 'research',
            progress: msg.progress != null ? msg.progress : (activeTasks.get(rid) || {}).progress,
            phase: msg.phase || msg.status || (activeTasks.get(rid) || {}).phase,
          });
          updateTaskDrawer();
          return;
        }

        // ── Inbox events (Task 4.2) ──
        if (msg.type === 'inbox:state') {
          inboxItems = new Map();
          const items = Array.isArray(msg.items) ? msg.items : [];
          for (const it of items) {
            if (it && it.id && it.status === 'pending') inboxItems.set(it.id, it);
          }
          renderInbox();
          return;
        }
        if (msg.type === 'inbox:item_added') {
          if (msg.item && msg.item.id) {
            inboxItems.set(msg.item.id, msg.item);
            renderInbox();
            announceToSR('New inbox item: ' + (msg.item.topic || ''));
          }
          return;
        }
        if (msg.type === 'inbox:item_updated') {
          if (msg.item && msg.item.id) {
            if (msg.item.status === 'pending') {
              inboxItems.set(msg.item.id, msg.item);
            } else {
              inboxItems.delete(msg.item.id);
            }
            renderInbox();
          }
          return;
        }
        if (msg.type === 'inbox:expired') {
          // Request fresh state rather than pruning locally
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'inbox:refresh' }));
          }
          return;
        }
        if (msg.type === 'inbox:error') {
          console.warn('[OVERLAY] inbox error:', msg.error, 'id:', msg.id);
          return;
        }

        if (msg.type === 'thinking') {
          icon.classList.add('thinking');
          setAgentBusy(true);
          replyBox.classList.remove('visible');
          progress.classList.remove('visible');
          progress.innerHTML = '';
          clearInteractive();
        }
        else if (msg.type === 'thinking_content') {
          // Live thinking display — show model reasoning as it arrives
          const thinkingText = (msg.text || '').trim();
          if (thinkingText) {
            const truncated = thinkingText.length > 600 ? thinkingText.substring(0, 600) + '...' : thinkingText;
            progress.innerHTML = `<div class="thinking-block"><div class="thinking-label">💭 thinking</div>${esc(truncated)}</div>`;
            progress.classList.add('visible');
          }
        }
        else if (msg.type === 'progress') {
          // Render as enhanced progress card
          const progressIcon = extractProgressIcon(msg.text);
          const progressLabel = msg.text.replace(/^[\u2728\u2699\ufe0f\ud83d\udd0d\ud83c\udf10\ud83d\udcd6\u270f\ufe0f\ud83d\udcf8\ud83d\udcad\u23f3\u26a0\ufe0f]\s?/u, '');
          progress.innerHTML = `<div class="progress-card"><span class="progress-icon">${progressIcon}</span><span class="progress-label">${esc(progressLabel)}</span><div class="progress-dots"><span></span><span></span><span></span></div></div>`;
          progress.classList.add('visible');
        }
        else if (msg.type === 'response' || msg.type === 'error') {
          icon.classList.remove('thinking');
          setAgentBusy(false);
          progress.classList.remove('visible');
          progress.innerHTML = '';

          const rawText = msg.text || '(no response)';
          console.log('[OVERLAY] Response text length:', rawText.length, 'preview:', rawText.substring(0, 100));
          const renderedText = msg.type === 'error' ? `⚠️ ${esc(rawText)}` : renderMd(rawText);
          console.log('[OVERLAY] Rendered HTML length:', renderedText.length);
          replyText.innerHTML = renderedText;
          replyBox.classList.remove('visible');
          replyBox.offsetHeight;
          replyBox.classList.add('visible');
          input.value = '';
          input.disabled = false;
          waiting = false;
          announceToSR(msg.type === 'error' ? 'Error received from A.T.L.A.S' : 'Response received from A.T.L.A.S');

          // Render interactive elements
          clearInteractive();
          if (msg.widgets && msg.widgets.length > 0) {
            renderWidgets(msg.widgets);
          }
          if (msg.quickActions && msg.quickActions.length > 0) {
            renderQuickActions(msg.quickActions);
          }
          if ((msg.files && msg.files.length > 0) || (msg.links && msg.links.length > 0)) {
            renderCards(msg.files || [], msg.links || []);
          }

          grabFocus();
        }
        else if (msg.type === 'silent') {
          icon.classList.remove('thinking');
          setAgentBusy(false);
          progress.classList.remove('visible');
          progress.innerHTML = '';
          replyBox.classList.remove('visible');
          clearInteractive();
          input.value = '';
          input.disabled = false;
          waiting = false;
          grabFocus();
        }
        else if (msg.type === 'image') {
          icon.classList.remove('thinking');
          progress.classList.remove('visible');
          progress.innerHTML = '';
          let imgHtml = `<img src="${msg.url}" alt="Generated image" />`;
          if (msg.caption) imgHtml += `<div class="img-caption">${esc(msg.caption)}</div>`;
          replyText.innerHTML = imgHtml;
          replyBox.classList.remove('visible');
          replyBox.offsetHeight;
          replyBox.classList.add('visible');
        }
        else if (msg.type === 'placeholder') {
          input.placeholder = msg.text || 'Ask A.T.L.A.S…';
        }
        else if (msg.type === 'notification') {
          if (notifTimer) { clearTimeout(notifTimer); notifTimer = null; }
          notifText.innerHTML = renderMd(msg.text);
          notifBox.classList.remove('visible', 'dismissing');
          notifBox.offsetHeight;
          notifBox.classList.add('visible');
          notifTimer = setTimeout(() => {
            notifBox.classList.add('dismissing');
            setTimeout(() => {
              notifBox.classList.remove('visible', 'dismissing');
              notifTimer = null;
            }, 400);
          }, 12000);
        }
        else if (msg.type === 'research_complete') {
          // Remove research from task drawer
          const rid = msg.taskId || msg.id || 'research';
          activeTasks.delete(rid);
          updateTaskDrawer();
          announceToSR('Deep research completed');
          // Auto-show overlay window when research completes
          if (window.atlasOverlay && window.atlasOverlay.showWindow) {
            window.atlasOverlay.showWindow();
          }
          // Also send a native notification
          if (window.atlasOverlay && window.atlasOverlay.notify) {
            window.atlasOverlay.notify('Research Complete', msg.text || 'Your deep research has finished.');
          }
          // Show the result in the overlay as a persistent notification (no auto-dismiss)
          if (notifTimer) { clearTimeout(notifTimer); notifTimer = null; }
          notifText.innerHTML = renderMd(msg.text);
          notifBox.classList.remove('visible', 'dismissing');
          notifBox.offsetHeight;
          notifBox.classList.add('visible');
          // Don't auto-dismiss — user should see this and can dismiss manually
        }
        else if (msg.type === 'voice_result') {
          micBtn.classList.remove('listening');
          isListening = false;
          if (msg.text) {
            input.placeholder = 'Ask A.T.L.A.S…';
            input.value = msg.text;
            send();
          } else {
            input.placeholder = 'Analyzing audio…';
            icon.classList.add('thinking');
            waiting = true;
            input.disabled = true;
          }
        }
        else if (msg.type === 'voice_status') {
          if (msg.status === 'listening') {
            micBtn.classList.add('listening');
            input.placeholder = 'Listening…';
          } else if (msg.status === 'processing') {
            micBtn.classList.remove('listening');
            input.placeholder = 'Analyzing audio…';
          } else if (msg.status === 'error') {
            micBtn.classList.remove('listening');
            isListening = false;
            input.placeholder = msg.error || 'Voice error';
            setTimeout(() => { input.placeholder = 'Ask A.T.L.A.S…'; }, 2000);
          }
        }
        // ── Live Voice Mode status ──
        else if (msg.type === 'voice_live_status') {
          handleLiveVoiceStatus(msg);
        }
        else if (msg.type === 'voice_live_transcript') {
          handleLiveVoiceTranscript(msg);
        }
        else if (msg.type === 'voice_live_tool') {
          handleLiveVoiceTool(msg);
        }
      }

      // ── Widgets ──
      function renderWidgets(widgets) {
        widgetsBox.innerHTML = '';
        widgets.forEach(w => {
          if (w.type === 'clock') {
            const card = document.createElement('div');
            card.className = 'widget-card widget-clock';
            card.innerHTML = `
              <div class="widget-icon">⏱️</div>
              <div class="widget-content">
                <div class="widget-time" id="live-time"></div>
                <div class="widget-date" id="live-date"></div>
              </div>
            `;
            widgetsBox.appendChild(card);

            const timeEl = card.querySelector('#live-time');
            const dateEl = card.querySelector('#live-date');

            const updateClock = () => {
              const now = new Date();
              timeEl.textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
              dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            };

            updateClock();
            activeTimers.push(setInterval(updateClock, 1000));
          }
          // Placeholder for future weather widget
        });
      }

      // ── Quick Action Buttons ──
      function renderQuickActions(actions) {
        quickActionsBox.innerHTML = '';
        const DANGER_WORDS = ['delete', 'remove', 'destroy', 'drop', 'erase', 'nuke', 'wipe', 'uninstall'];
        const CONFIRM_WORDS = ['yes', 'confirm', 'approve', 'accept', 'proceed', 'go ahead', 'do it', 'ok'];

        actions.forEach(label => {
          const btn = document.createElement('button');
          btn.className = 'quick-action-btn';
          btn.textContent = label;
          const lower = label.toLowerCase();

          if (DANGER_WORDS.some(w => lower.includes(w))) btn.classList.add('danger');
          else if (CONFIRM_WORDS.some(w => lower.includes(w))) btn.classList.add('confirm');

          btn.onclick = () => {
            if (!ws || ws.readyState !== 1 || waiting) return;
            waiting = true;
            input.disabled = true;
            replyBox.classList.remove('visible');
            clearInteractive();
            ws.send(JSON.stringify({ type: 'quick_action', text: label }));
          };
          quickActionsBox.appendChild(btn);
        });
      }

      // ── File & Link Cards ──
      function renderCards(files, links) {
        cardsBox.innerHTML = '';

        files.forEach(filePath => {
          const card = document.createElement('a');
          card.className = 'file-card';
          card.href = '#';
          const basename = filePath.split('/').pop() || filePath;
          const ext = basename.split('.').pop() || '';
          const icon = getFileIcon(ext);
          card.innerHTML = `<span class="card-icon">${icon}</span><span class="card-label" title="${esc(filePath)}">${esc(basename)}</span>`;
          card.onclick = (e) => {
            e.preventDefault();
            if (ws && ws.readyState === 1) {
              ws.send(JSON.stringify({ type: 'chat', text: `open ${filePath}` }));
            }
          };
          cardsBox.appendChild(card);
        });

        links.forEach(url => {
          const card = document.createElement('a');
          card.className = 'link-card';
          card.href = url;
          card.target = '_blank';
          let domain = url;
          try { domain = new URL(url).hostname.replace(/^www\./, ''); } catch { }
          card.innerHTML = `<span class="card-icon">🌐</span><span class="card-label" title="${esc(url)}">${esc(domain)}</span>`;
          cardsBox.appendChild(card);
        });
      }

      function getFileIcon(ext) {
        const icons = {
          'ts': '📜', 'js': '📜', 'tsx': '📜', 'jsx': '📜',
          'py': '🐍', 'rs': '⚙️', 'go': '⚙️',
          'html': '🌐', 'css': '🎨', 'scss': '🎨',
          'json': '📋', 'yaml': '📋', 'yml': '📋', 'toml': '📋',
          'md': '🗒️', 'txt': '🗒️',
          'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️', 'svg': '🖼️', 'gif': '🖼️',
          'pdf': '📄', 'doc': '📄', 'docx': '📄',
          'sh': '⌨️', 'bash': '⌨️', 'zsh': '⌨️',
        };
        return icons[ext.toLowerCase()] || '📁';
      }

      // ── Progress icon extraction ──
      function extractProgressIcon(text) {
        const match = text.match(/^([\p{Emoji}\u200d\ufe0f]+)/u);
        return match ? match[1] : '💭';
      }



      function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

      function renderMd(text) {
        let h = esc(text);
        // Code blocks with copy button
        h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => {
          const code = c.trim();
          const id = 'cb' + Math.random().toString(36).substr(2, 6);
          return `<div class="code-wrap"><button class="copy-btn" onclick="copyCode('${id}')">Copy</button><pre><code id="${id}">${code}</code></pre></div>`;
        });
        // Collapsible sections: <!--COLLAPSE:Title-->content<!--/COLLAPSE-->
        h = h.replace(/&lt;!--COLLAPSE:(.*?)--&gt;([\s\S]*?)&lt;!--\/COLLAPSE--&gt;/g, (_, title, content) => {
          const id = 'cl' + Math.random().toString(36).substr(2, 6);
          return `<div class="collapse-section" id="${id}"><div class="collapse-header" onclick="toggleCollapse('${id}')"><span class="collapse-arrow">▶</span>${title.trim()}</div><div class="collapse-body"><div class="collapse-content">${content.trim()}</div></div></div>`;
        });
        
        // Tables
        const tableRegex = /^\|(.+)\|\n\|([ \-\|:]+)\|\n((\|.*\|\n?)+)/gm;
        h = h.replace(tableRegex, (match, header, sep, body) => {
          const makeRow = (row, tag) => {
            const cols = row.trim().replace(/^\||\|$/g, '').split('|');
            return `<tr>${cols.map(c => `<${tag}>${c.trim()}</${tag}>`).join('')}</tr>`;
          };
          const thead = makeRow(header, 'th');
          const tbody = body.trim().split('\n').map(r => r.trim() ? makeRow(r, 'td') : '').join('');
          return `<div class="table-wrapper"><table class="md-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
        });

        h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        h = h.replace(/(?<!\w)\*([^*\n]+?)\*(?!\w)/g, '<em>$1</em>');
        h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#818cf8">$1</a>');
        h = h.replace(/^[\s]*[*\-]\s+/gm, '• ');
        h = h.replace(/\n/g, '<br>');
        return h;
      }

      let lvStartTs = 0;

      function lvFormatTime(ms) {

      function lvSetState(status, label) {

        states.forEach(s => lvPanel.classList.remove('state-' + s));

      function lvOpenPanel() {

      function lvClosePanel() {

      // Assistant-streaming text from Gemini Live arrives as small DELTAS (per-chunk)
      // via `outputTranscription`. Append them instead of replacing the element body.
      function lvAppendAssistantDelta(delta) {
        if (!lvStreamingAiTurn) {
          const el = document.createElement('div');
          el.className = 'lv-turn turn-ai streaming';
          el.textContent = delta || '';
          lvTranscript.appendChild(el);
          lvStreamingAiTurn = el;
        } else {
          lvStreamingAiTurn.textContent += (delta || '');
        }
        lvTranscript.scrollTop = lvTranscript.scrollHeight;
      }

      function lvAppendUserTurn(text) {
        const el = document.createElement('div');
        el.className = 'lv-turn turn-user';
        el.textContent = text || '';
        lvTranscript.appendChild(el);
        lvTranscript.scrollTop = lvTranscript.scrollHeight;
      }

      function lvFinalizeAiTurn() {
        if (lvStreamingAiTurn) {
          lvStreamingAiTurn.classList.remove('streaming');
          lvStreamingAiTurn = null;
        }
      }

      function lvUpsertChip(id, name, state) {
        const key = id || name;
        let chip = lvChipMap.get(key);
        if (!chip) {
          chip = document.createElement('span');
          chip.className = 'lv-chip';
          chip.textContent = name;
          lvChips.appendChild(chip);
          lvChipMap.set(key, chip);
        }
        chip.className = 'lv-chip ' + (state || '');
        // Auto-prune resolved chips so a long session doesn't accumulate them.
        if (state === 'done' || state === 'failed') {
          setTimeout(() => {
            if (chip.parentNode === lvChips) lvChips.removeChild(chip);
            lvChipMap.delete(key);
          }, 8000);
        }
      }

      let lvAmpStarting = false;
      async function lvStartAmpMonitor() {
        if (lvAmpStream || lvAmpStarting) return;
        lvAmpStarting = true;
        let stream = null, ctx = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          // If the panel was closed while the permission prompt was up, abort.
          if (!lvActive) {
            stream.getTracks().forEach(t => t.stop());
            return;
          }
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          lvAmpStream = stream;
          lvAmpCtx = ctx;
          const source = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 512;
          source.connect(analyser);
          const data = new Uint8Array(analyser.fftSize);
          // Simple envelope follower so the orb doesn't jitter between samples.
          let smoothed = 0;
          const tick = () => {
            if (!lvActive) return;
            analyser.getByteTimeDomainData(data);
            let sum = 0;
            for (let i = 0; i < data.length; i++) {
              const v = (data[i] - 128) / 128;
              sum += v * v;
            }
            const rms = Math.sqrt(sum / data.length);
            const target = Math.min(1, rms * 3.6);
            // Attack fast, release slow — gives the orb a lively-but-not-twitchy pulse.
            smoothed += (target > smoothed ? 0.4 : 0.1) * (target - smoothed);
            lvPanel.style.setProperty('--lv-amp', smoothed.toFixed(3));
            lvAmpRaf = requestAnimationFrame(tick);
          };
          tick();
        } catch (err) {
          // User denied mic permission or browser can't tap the stream — degrade silently.
          console.warn('Live voice amp monitor unavailable:', err && err.message);
          if (stream) stream.getTracks().forEach(t => t.stop());
          if (ctx && ctx.state !== 'closed') ctx.close().catch(() => {});
          // Clear the globals too — otherwise the in-flight guard
          // blocks future restarts for the remainder of the session.
          lvAmpStream = null;
          lvAmpCtx = null;
        } finally {
          lvAmpStarting = false;
        }
      }

      function lvStopAmpMonitor() {
        if (lvAmpRaf) cancelAnimationFrame(lvAmpRaf);
        lvAmpRaf = 0;
        if (lvAmpStream) { lvAmpStream.getTracks().forEach(t => t.stop()); lvAmpStream = null; }
        if (lvAmpCtx && lvAmpCtx.state !== 'closed') { lvAmpCtx.close().catch(() => {}); }
        lvAmpCtx = null;
        lvPanel.style.setProperty('--lv-amp', '0');
      }

      function handleLiveVoiceStatus(msg) {
        const s = msg.status;
        if (s === 'connecting') {
          lvOpenPanel();
          lvSetState('connecting', 'Connecting…');
        } else if (s === 'active') {
          // Turn completed naturally (not interrupted) — finalize any
          // streaming AI bubble so subsequent response_transcript events
          // start a new bubble instead of compounding onto this one.
          lvFinalizeAiTurn();
          lvSetState('listening', 'Listening');
        } else if (s === 'user_speaking') {
          // New user turn beginning — finalize any leftover AI bubble too.
          lvFinalizeAiTurn();
          lvSetState('listening', 'You’re talking');
        } else if (s === 'processing' || s === 'thinking') {
          lvSetState('thinking', 'Thinking');
        } else if (s === 'speaking') {
          lvSetState('speaking', 'Speaking');
        } else if (s === 'interrupted') {
          lvSetState('interrupted', 'Interrupted');
          lvFinalizeAiTurn();
          setTimeout(() => { if (lvActive) lvSetState('listening', 'Listening'); }, 400);
        } else if (s === 'reconnecting') {
          lvSetState('reconnecting', 'Reconnecting…');
        } else if (s === 'muted') {
          lvMuteBtn.setAttribute('aria-pressed', 'true');
          lvMuteBtn.textContent = 'Unmute';
          lvSetState('listening', 'Muted');
        } else if (s === 'unmuted') {
          lvMuteBtn.setAttribute('aria-pressed', 'false');
          lvMuteBtn.textContent = 'Mute';
          lvSetState('listening', 'Listening');
        } else if (s === 'ended') {
          lvFinalizeAiTurn();
          lvSetState('ended', 'Ended');
          setTimeout(() => lvClosePanel(), 600);
        } else if (s === 'already_active') {
          // Just make sure the panel is open
          if (!lvActive) { lvOpenPanel(); lvSetState('listening', 'Listening'); }
        } else if (s === 'error' || s === 'unavailable') {
          lvSetState('error', msg.error || 'Live voice unavailable');
          setTimeout(() => lvClosePanel(), 1800);
        }
      }

      function handleLiveVoiceTranscript(msg) {
        const role = msg.role === 'user' ? 'user' : 'assistant';
        const text = typeof msg.text === 'string' ? msg.text : '';
        if (!text) return;
        if (role === 'user') {
          lvAppendUserTurn(text);
          return;
        }
        // Assistant: final==false means this is a streaming delta; otherwise a
        // completed utterance (append as its own final turn).
        if (msg.final === false) {
          lvAppendAssistantDelta(text);
        } else {
          lvAppendAssistantDelta(text);
          lvFinalizeAiTurn();
        }
      }

      function handleLiveVoiceTool(msg) {
        if (!msg.id && !msg.name) return;
        if (!msg.id) return;
        const existing = lvChipMap.get(msg.id);
        // Fall back to "tool" rather than an empty label so an orphan
        // cancellation for a chip we never rendered is still intelligible.
        const label = msg.name || (existing ? existing.textContent : 'tool');
        lvUpsertChip(msg.id, label, msg.state || 'pending');
      }

      liveBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!ws || ws.readyState !== 1) return;

      lvMuteBtn.addEventListener('click', () => {
        if (!ws || ws.readyState !== 1 || !lvActive) return;
