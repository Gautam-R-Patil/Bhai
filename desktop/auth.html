<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.L.A.S — Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* auth.html overrides — uses the shared colorful-glass theme from
           styles.css for orbs, grain, type, buttons. Keeps only
           layout-level tweaks specific to this page's centered card. */

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
            overflow: hidden;
        }

        .auth-wrap {
            position: relative;
            z-index: var(--z-base);
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            border: var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow:
                var(--shadow-glass-lg),
                var(--shadow-inner);
        }

        .logo { text-align: center; margin-bottom: 24px; }

        /* Brand mark — real ATLAS logo in a rounded square. Warm tinted
           shadow so it grounds against the colorful orb background without
           the generic black dropshadow look. */
        .logo-circle {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            padding: 0;
            overflow: hidden;
            background: transparent;
            box-shadow:
                0 2px 6px rgba(80, 60, 55, 0.10),
                0 10px 28px rgba(80, 60, 55, 0.14);
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 6px;
            text-wrap: balance;
        }

        .section { margin-top: 20px; }

        label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
            text-transform: none;  /* sentence case, not all-caps */
        }

        .phone-row { display: flex; gap: 8px; }

        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--glass-input);
            border: 1px solid rgba(80, 60, 55, 0.12);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            transition: all 0.18s ease;
            outline: none;
        }
        input::placeholder { color: var(--text-muted); }
        input:hover:not(:focus) {
            background: rgba(255, 255, 255, 0.7);
        }
        input:focus {
            background: var(--glass-input-focus);
            border-color: rgba(232, 83, 63, 0.4);
            box-shadow: 0 0 0 4px var(--accent-ring);
        }
        .cc-input {
            width: 72px;
            flex-shrink: 0;
            text-align: center;
            font-weight: 500;
        }

        /* Local overrides on .btn — scoped because styles.css defines
           .btn without `width: 100%`; we need full-width here. */
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 12px;
        }

        .btn-google {
            background: #ffffff;
            border: 1px solid rgba(80, 60, 55, 0.14);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 1px 3px rgba(80, 60, 55, 0.08);
        }
        .btn-google:hover:not(:disabled) {
            background: #fffdfa;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(80, 60, 55, 0.12);
        }
        .btn-google:active {
            transform: translateY(0) scale(0.98);
            transition-duration: 80ms;
        }
        .btn-google:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 4px;
        }
        .divider hr {
            flex: 1;
            border: none;
            border-top: 1px solid rgba(80, 60, 55, 0.10);
        }
        .divider span {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }

        .resend-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }
        .text-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .text-btn:hover:not(:disabled) {
            color: var(--accent-primary);
            background: var(--accent-tint);
        }
        .text-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--accent-ring);
        }
        .text-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ═══ Loading state — warm dual-ring spinner + contextual caption ═══ */
        #loadingState {
            text-align: center;
            padding: 36px 0 28px;
            animation: state-fade-in 0.24s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Dual-ring spinner: outer static tint ring + inner sweeping arc.
           Feels lighter and more intentional than a single rotating circle. */
        .spinner {
            position: relative;
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
        }
        .spinner::before,
        .spinner::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }
        /* Soft amber→coral gradient ring underneath */
        .spinner::before {
            background: conic-gradient(from 0deg,
                rgba(249, 179, 77, 0.18),
                rgba(232, 83, 63, 0.22),
                rgba(249, 179, 77, 0.18));
            mask: radial-gradient(circle, transparent 58%, #000 60%);
            -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%);
        }
        /* Sweeping coral arc on top */
        .spinner::after {
            border: 3px solid transparent;
            border-top-color: var(--accent-primary);
            border-right-color: var(--accent-primary);
            animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.3, 0.9) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loadingMsg {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.005em;
        }
        .loading-sub {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            min-height: 1em;
        }

        /* Animated dots — "Sending OTP." → ".." → "..." — visible cue that
           the app isn't frozen even when the network reply is slow. */
        .loading-dots::after {
            content: "";
            display: inline-block;
            width: 1.2em;
            text-align: left;
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0%   { content: ""; }
            25%  { content: "."; }
            50%  { content: ".."; }
            75%  { content: "..."; }
            100% { content: ""; }
        }

        /* ═══ Success state — SVG check draw-on + fade subtitle ═══ */
        #successState {
            text-align: center;
            padding: 36px 0 28px;
            animation: state-fade-in 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .check-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(47, 176, 106, 0.22) 0%,
                rgba(47, 176, 106, 0.08) 60%,
                rgba(47, 176, 106, 0) 100%);
            animation: check-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .check-wrap svg {
            width: 36px;
            height: 36px;
            overflow: visible;
        }
        .check-wrap circle {
            fill: none;
            stroke: var(--accent-success);
            stroke-width: 2.5;
            stroke-dasharray: 94;              /* 2π × 15 */
            stroke-dashoffset: 94;
            animation: draw-circle 0.5s 0.05s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
        .check-wrap path {
            fill: none;
            stroke: var(--accent-success);
            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            animation: draw-check 0.35s 0.35s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes draw-circle {
            to { stroke-dashoffset: 0; }
        }
        @keyframes draw-check {
            to { stroke-dashoffset: 0; }
        }
        @keyframes check-pop {
            0%   { transform: scale(0.4); opacity: 0; }
            60%  { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-headline {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text-primary);
            opacity: 0;
            animation: fade-up 0.4s 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .success-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
            opacity: 0;
            animation: fade-up 0.4s 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .success-sub .ident {
            color: var(--text-primary);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        /* Thin progress line hinting the auto-redirect. Kept quiet, 2 s fill. */
        .success-progress {
            width: 120px;
            height: 3px;
            margin: 18px auto 0;
            border-radius: 2px;
            background: rgba(47, 176, 106, 0.12);
            overflow: hidden;
            opacity: 0;
            animation: fade-up 0.4s 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .success-progress::after {
            content: "";
            display: block;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-success), rgba(47, 176, 106, 0.5));
            animation: progress-fill 2s 0.7s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
        }
        @keyframes progress-fill {
            to { width: 100%; }
        }

        @keyframes state-fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Error banner — warm red tint on glass */
        .error-banner {
            background: rgba(197, 57, 47, 0.10);
            border: 1px solid rgba(197, 57, 47, 0.22);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--accent-danger);
            margin-top: 12px;
            display: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<!-- Colorful orb background shared with the rest of the app -->
<div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
    <div class="orb orb-6"></div>
</div>

<div class="auth-wrap">
<div class="card">
    <div class="logo">
        <div class="logo-circle"><img src="logo.png" alt="A.T.L.A.S"></div>
        <h1>Sign in to A.T.L.A.S</h1>
        <p class="subtitle">Enter your phone number or continue with Google</p>
    </div>

    <!-- Step 1: Phone Input -->
    <div id="step1">
        <div class="section">
            <label>Phone Number</label>
            <div class="phone-row">
                <input class="cc-input" type="text" id="ccInput" value="+91" maxlength="5">
                <input type="tel" id="phoneInput" placeholder="10-digit number" maxlength="10" inputmode="numeric">
            </div>
        </div>
        <button class="btn btn-primary" id="sendBtn" onclick="sendOTP()">Send OTP</button>

        <div class="divider"><hr><span>or</span><hr></div>
        <button class="btn btn-google" id="googleBtn" onclick="signInGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>
        <div id="errorBanner" class="error-banner"></div>
    </div>

    <!-- Step 2: OTP Verification -->
    <div id="step2" class="hidden">
        <div class="section">
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">OTP sent to <strong id="sentTo" style="color:var(--text-primary);font-variant-numeric:tabular-nums;"></strong></p>
            <label>Enter OTP</label>
            <input type="text" id="otpInput" placeholder="6-digit OTP" maxlength="6" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')">
        </div>
        <button class="btn btn-primary" id="verifyBtn" onclick="verifyOTP()">Verify &amp; Sign In</button>
        <div class="resend-row">
            <button class="text-btn" onclick="goBack()">← Change number</button>
            <button class="text-btn" id="resendBtn" onclick="resendOTP()" disabled>Resend (<span id="resendTimer">30</span>s)</button>
        </div>
        <div id="errorBanner2" class="error-banner"></div>
    </div>

    <!-- Loading -->
    <div id="loadingState" class="hidden">
        <div class="spinner" aria-hidden="true"></div>
        <p id="loadingMsg" class="loading-dots">Please wait</p>
        <span id="loadingSub" class="loading-sub"></span>
    </div>

    <!-- Success -->
    <div id="successState" class="hidden">
        <div class="check-wrap" aria-hidden="true">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="16" r="15"/>
                <path d="M10 16.5 L14.5 21 L22.5 12"/>
            </svg>
        </div>
        <p class="success-headline">You're in</p>
        <p class="success-sub" id="successSub">Opening A.T.L.A.S<span class="loading-dots"></span></p>
        <div class="success-progress" aria-hidden="true"></div>
    </div>
</div>
</div>

<script>
    // atlas.auth is injected by auth-preload.js via contextBridge / window injection
    const bridge = window.atlasAuth;

    let _phone = '';
    let _cc = '';
    let _resendInterval = null;

    // ── OTP Flow (via Electron IPC → fast2sms) ────────────────────────

    async function sendOTP() {
        const phone = document.getElementById('phoneInput').value.trim();
        const cc = document.getElementById('ccInput').value.trim() || '+91';
        if (!phone || phone.replace(/\D/g,'').length < 6) {
            showError('Enter a valid phone number');
            return;
        }
        _phone = phone;
        _cc = cc;
        hideError();
        showLoading('Sending OTP…');

        try {
            const result = await bridge.sendOtp({ phone, countryCode: cc });
            if (result.success) {
                showStep2();
                startResend();
            } else {
                resetToStep1();
                showError(result.error || 'Failed to send OTP');
            }
        } catch (err) {
            resetToStep1();
            showError(err.message || 'Failed to send OTP');
        }
    }

    async function verifyOTP() {
        const otp = document.getElementById('otpInput').value.trim();
        if (!otp || otp.length < 4) { showError2('Enter the OTP'); return; }
        hideError2();
        document.getElementById('verifyBtn').disabled = true;
        document.getElementById('verifyBtn').textContent = 'Verifying…';

        try {
            const result = await bridge.verifyOtp({ phone: _phone, countryCode: _cc, otp });
            if (result.success) {
                showSuccess();
                // Auth complete — main.js will close window and save session
            } else {
                document.getElementById('verifyBtn').disabled = false;
                document.getElementById('verifyBtn').textContent = 'Verify & Sign In';
                showError2(result.error || 'Incorrect OTP. Please try again.');
            }
        } catch (err) {
            document.getElementById('verifyBtn').disabled = false;
            document.getElementById('verifyBtn').textContent = 'Verify & Sign In';
            showError2(err.message || 'Verification failed');
        }
    }

    async function resendOTP() {
        document.getElementById('otpInput').value = '';
        hideError2();
        showLoading('Resending OTP…');
        try {
            const result = await bridge.sendOtp({ phone: _phone, countryCode: _cc });
            if (result.success) {
                showStep2();
                startResend();
            } else {
                showStep2();
                showError2(result.error || 'Failed to resend OTP');
            }
        } catch(err) {
            showStep2();
            showError2(err.message || 'Failed to resend');
        }
    }

    // ── Google OAuth (via Electron IPC → native OAuth flow) ──────────

    async function signInGoogle() {
        const btn = document.getElementById('googleBtn');
        btn.disabled = true;
        showLoading('Opening Google sign-in…');
        try {
            const result = await bridge.googleOAuth();
            if (result.success) {
                showSuccess();
                // Session will be saved and window closed by main.js on google-oauth-success
            } else {
                resetToStep1();
                showError(result.error || 'Google sign-in failed');
            }
        } catch (err) {
            resetToStep1();
            showError(err.message || 'Google sign-in failed');
        } finally {
            btn.disabled = false;
        }
    }

    // ── Resend Countdown ──────────────────────────────────────────────

    function startResend() {
        stopResend();
        let secs = 30;
        const btn = document.getElementById('resendBtn');
        const timer = document.getElementById('resendTimer');
        btn.disabled = true;
        btn.textContent = `Resend (${secs}s)`;
        _resendInterval = setInterval(() => {
            secs--;
            btn.textContent = `Resend (${secs}s)`;
            timer.textContent = secs;
            if (secs <= 0) {
                stopResend();
                btn.disabled = false;
                btn.textContent = 'Resend OTP';
            }
        }, 1000);
    }

    function stopResend() {
        if (_resendInterval) { clearInterval(_resendInterval); _resendInterval = null; }
    }

    function goBack() {
        stopResend();
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
    }

    // ── UI State ──────────────────────────────────────────────────────

    function showStep2() {
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        document.getElementById('sentTo').textContent = _cc + ' ' + _phone;
        document.getElementById('verifyBtn').disabled = false;
        document.getElementById('verifyBtn').textContent = 'Verify & Sign In';
        document.getElementById('otpInput').focus();
    }

    // Contextual sub-captions so the loading state tells the user what's
    // actually happening, not just "please wait".
    const LOADING_SUBS = {
        "Sending OTP":         "Texting a one-time code to your phone",
        "Resending OTP":       "Triggering a fresh code",
        "Opening Google sign-in": "Switch to the browser window to continue",
        "Verifying":           "Checking the code",
    };

    function showLoading(msg) {
        ['step1','step2','successState'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById('loadingState').classList.remove('hidden');
        // Strip trailing ellipsis — we append our own animated dots.
        const clean = (msg || 'Please wait').replace(/[.…\s]+$/, '');
        document.getElementById('loadingMsg').textContent = clean;
        const sub = LOADING_SUBS[clean] || '';
        document.getElementById('loadingSub').textContent = sub;
    }

    function showSuccess() {
        ['step1','step2','loadingState'].forEach(id => document.getElementById(id).classList.add('hidden'));
        // Personalize the sub-caption when we have identity context.
        const subEl = document.getElementById('successSub');
        if (_phone) {
            subEl.innerHTML = `Signed in as <span class="ident">${_cc} ${_phone}</span>. Opening A.T.L.A.S<span class="loading-dots"></span>`;
        } else {
            subEl.innerHTML = `Opening A.T.L.A.S<span class="loading-dots"></span>`;
        }
        document.getElementById('successState').classList.remove('hidden');
    }

    function resetToStep1() {
        ['loadingState','step2','successState'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById('step1').classList.remove('hidden');
        const btn = document.getElementById('sendBtn');
        btn.disabled = false;
        btn.textContent = 'Send OTP';
    }

    function showError(msg) {
        const el = document.getElementById('errorBanner');
        el.textContent = '⚠ ' + msg;
        el.style.display = 'block';
    }
    function hideError() { document.getElementById('errorBanner').style.display = 'none'; }

    function showError2(msg) {
        const el = document.getElementById('errorBanner2');
        el.textContent = '⚠ ' + msg;
        el.style.display = 'block';
    }
    function hideError2() { document.getElementById('errorBanner2').style.display = 'none'; }

    // Enter key support
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const s1 = !document.getElementById('step1').classList.contains('hidden');
        const s2 = !document.getElementById('step2').classList.contains('hidden');
        if (s1) sendOTP();
        else if (s2) verifyOTP();
    });
</script>
</body>
</html>
