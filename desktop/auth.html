<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.T.L.A.S — Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* auth.html overrides — uses the shared colorful-glass theme from
           styles.css for orbs, grain, type, buttons. Keeps only
           layout-level tweaks specific to this page's centered card. */

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
            overflow: hidden;
        }

        .auth-wrap {
            position: relative;
            z-index: var(--z-base);
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            border: var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow:
                var(--shadow-glass-lg),
                var(--shadow-inner);
        }

        .logo { text-align: center; margin-bottom: 24px; }

        /* Brand mark — real ATLAS logo in a rounded square. Warm tinted
           shadow so it grounds against the colorful orb background without
           the generic black dropshadow look. */
        .logo-circle {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            padding: 0;
            overflow: hidden;
            background: transparent;
            box-shadow:
                0 2px 6px rgba(80, 60, 55, 0.10),
                0 10px 28px rgba(80, 60, 55, 0.14);
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 6px;
            text-wrap: balance;
        }

        .section { margin-top: 20px; }

        label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
            text-transform: none;  /* sentence case, not all-caps */
        }

        .phone-row { display: flex; gap: 8px; }

        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--glass-input);
            border: 1px solid rgba(80, 60, 55, 0.12);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            transition: all 0.18s ease;
            outline: none;
        }
        input::placeholder { color: var(--text-muted); }
        input:hover:not(:focus) {
            background: rgba(255, 255, 255, 0.7);
        }
        input:focus {
            background: var(--glass-input-focus);
            border-color: rgba(232, 83, 63, 0.4);
            box-shadow: 0 0 0 4px var(--accent-ring);
        }
        .cc-input {
            width: 72px;
            flex-shrink: 0;
            text-align: center;
            font-weight: 500;
        }

        /* Local overrides on .btn — scoped because styles.css defines
           .btn without `width: 100%`; we need full-width here. */
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 12px;
        }

        .btn-google {
            background: #ffffff;
            border: 1px solid rgba(80, 60, 55, 0.14);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 1px 3px rgba(80, 60, 55, 0.08);
        }
        .btn-google:hover:not(:disabled) {
            background: #fffdfa;
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(80, 60, 55, 0.12);
        }
        .btn-google:active {
            transform: translateY(0) scale(0.98);
            transition-duration: 80ms;
        }
        .btn-google:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 4px;
        }
        .divider hr {
            flex: 1;
            border: none;
            border-top: 1px solid rgba(80, 60, 55, 0.10);
        }
        .divider span {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }

        .resend-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }
        .text-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .text-btn:hover:not(:disabled) {
            color: var(--accent-primary);
            background: var(--accent-tint);
        }
        .text-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--accent-ring);
        }
        .text-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ═══ Loading state — warm dual-ring spinner + contextual caption ═══ */
        #loadingState {
            text-align: center;
            padding: 36px 0 28px;
            animation: state-fade-in 0.24s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Dual-ring spinner: outer static tint ring + inner sweeping arc.
           Feels lighter and more intentional than a single rotating circle. */
        .spinner {
            position: relative;
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
        }
        .spinner::before,
        .spinner::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }
        /* Soft amber→coral gradient ring underneath */
        .spinner::before {
            background: conic-gradient(from 0deg,
                rgba(249, 179, 77, 0.18),
                rgba(232, 83, 63, 0.22),
                rgba(249, 179, 77, 0.18));
            mask: radial-gradient(circle, transparent 58%, #000 60%);
            -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%);
        }
        /* Sweeping coral arc on top */
        .spinner::after {
            border: 3px solid transparent;
            border-top-color: var(--accent-primary);
            border-right-color: var(--accent-primary);
            animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.3, 0.9) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loadingMsg {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.005em;
        }
        .loading-sub {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            min-height: 1em;
        }

        /* Animated dots — "Sending OTP." → ".." → "..." — visible cue that
           the app isn't frozen even when the network reply is slow. */
        .loading-dots::after {
            content: "";
            display: inline-block;
            width: 1.2em;
            text-align: left;
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0%   { content: ""; }
            25%  { content: "."; }
            50%  { content: ".."; }
            75%  { content: "..."; }
            100% { content: ""; }
        }

        /* ═══ Success state — SVG check draw-on + fade subtitle ═══ */
        #successState {
            text-align: center;
            padding: 36px 0 28px;
            animation: state-fade-in 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .check-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(47, 176, 106, 0.22) 0%,
                rgba(47, 176, 106, 0.08) 60%,
                rgba(47, 176, 106, 0) 100%);
            animation: check-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .check-wrap svg {
            width: 36px;
            height: 36px;
            overflow: visible;
        }
        .check-wrap circle {
            fill: none;
            stroke: var(--accent-success);
            stroke-width: 2.5;
            stroke-dasharray: 94;              /* 2π × 15 */
            stroke-dashoffset: 94;
            animation: draw-circle 0.5s 0.05s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }
        .check-wrap path {
            fill: none;
            stroke: var(--accent-success);
            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            animation: draw-check 0.35s 0.35s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes draw-circle {
            to { stroke-dashoffset: 0; }
        }
        @keyframes draw-check {
            to { stroke-dashoffset: 0; }
        }
        @keyframes check-pop {
            0%   { transform: scale(0.4); opacity: 0; }
            60%  { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-headline {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text-primary);
            opacity: 0;
            animation: fade-up 0.4s 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .success-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
            opacity: 0;
            animation: fade-up 0.4s 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .success-sub .ident {
            color: var(--text-primary);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        /* Thin progress line hinting the auto-redirect. Kept quiet, 2 s fill. */
        .success-progress {
            width: 120px;
            height: 3px;
            margin: 18px auto 0;
            border-radius: 2px;
            background: rgba(47, 176, 106, 0.12);
            overflow: hidden;
            opacity: 0;
            animation: fade-up 0.4s 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .success-progress::after {
            content: "";
            display: block;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-success), rgba(47, 176, 106, 0.5));
            animation: progress-fill 2s 0.7s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
        }
        @keyframes progress-fill {
            to { width: 100%; }
        }

        @keyframes state-fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Error banner — warm red tint on glass */
        .error-banner {
            background: rgba(197, 57, 47, 0.10);
            border: 1px solid rgba(197, 57, 47, 0.22);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--accent-danger);
            margin-top: 12px;
            display: none;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<!-- Colorful orb background shared with the rest of the app -->
<div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
    <div class="orb orb-6"></div>
</div>

<div class="auth-wrap">
<div class="card">
    <div class="logo">
        <div class="logo-circle"><img src="logo.png" alt="A.T.L.A.S"></div>
        <h1>Sign in to A.T.L.A.S</h1>
        <p class="subtitle">Continue with phone, email, or a social account</p>
    </div>

    <!-- OTPless SDK renders its widget here -->
    <div id="otpless-login-page"></div>

    <!-- Loading overlay shown while the token is being validated server-side -->
    <div id="loadingState" class="hidden" style="text-align:center;padding:32px 0;">
        <div class="spinner"></div>
        <p style="font-size:14px;color:var(--text-secondary);">Verifying…</p>
    </div>

    <!-- Success state -->
    <div id="successState" class="hidden" style="text-align:center;padding:32px 0;">
        <div class="check" style="font-size:44px;margin-bottom:12px;">✅</div>
        <p style="font-size:16px;font-weight:600;color:var(--text-primary);">Signed in</p>
        <p style="font-size:13px;color:var(--text-secondary);margin-top:6px;">Returning to A.T.L.A.S…</p>
    </div>

    <div id="errorBanner" class="error-banner" style="display:none;"></div>
</div>
</div>

<!-- OTPless pre-built-UI SDK — renders the widget into #otpless-login-page.
     Fires window.otpless(user) on success. -->
<script
    id="otpless-sdk"
    src="https://otpless.com/v4/auth.js"
    data-appid="GY9VEBIDPJPIJU3LU4F5"
></script>

<script>
    // Global callback fired by the OTPless SDK on successful sign-in.
    // The token is short-lived and is validated server-side via the
    // Convex /api/otpless/validate-token route.
    async function otpless(otplessUser) {
        const token = otplessUser && otplessUser.token;
        if (!token) { showError("Sign-in returned no token."); return; }
        showLoading();
        try {
            const res = await window.atlasAuth.submitToken(token);
            if (res && res.success) {
                showSuccess();
                // main.js calls finalizeAuth(), which closes the window — nothing to do here.
            } else {
                showError((res && res.error) || "Sign-in failed. Please try again.");
            }
        } catch (err) {
            showError((err && err.message) || "Sign-in failed.");
        }
    }

    function showLoading() {
        document.getElementById("otpless-login-page").classList.add("hidden");
        document.getElementById("loadingState").classList.remove("hidden");
        document.getElementById("successState").classList.add("hidden");
        hideError();
    }
    function showSuccess() {
        document.getElementById("otpless-login-page").classList.add("hidden");
        document.getElementById("loadingState").classList.add("hidden");
        document.getElementById("successState").classList.remove("hidden");
    }
    function showError(msg) {
        document.getElementById("otpless-login-page").classList.remove("hidden");
        document.getElementById("loadingState").classList.add("hidden");
        document.getElementById("successState").classList.add("hidden");
        const el = document.getElementById("errorBanner");
        el.textContent = "⚠ " + msg;
        el.style.display = "block";
    }
    function hideError() { document.getElementById("errorBanner").style.display = "none"; }
</script>
</body>
</html>
