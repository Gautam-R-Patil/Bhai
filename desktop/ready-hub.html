<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"/>
<title>Bhai — Ready</title>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="components/components.css"/>
</head>
<body data-step="ready-hub">

<div class="atmosphere" aria-hidden="true">
    <div class="atmosphere-wash"></div>
    <div class="atmosphere-grain"></div>
</div>

<header class="chrome">
    <div class="chrome-mark">Bhai</div>
    <div class="chrome-folio">READY</div>
    <div class="chrome-tools">
        <button class="chrome-btn" title="Minimize" data-window-action="minimize" aria-label="Minimize">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="chrome-btn" title="Close" data-window-action="close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
</header>

<div class="iridescent-rule" id="iridescent-rule" aria-hidden="true"></div>

<main class="stage">
    <div id="hub-root" class="step-root"></div>
</main>

<script src="wizard/copy.js"></script>
<script src="wizard/cinematic.js"></script>
<script src="components/tile-model.js"></script>
<script src="components/diff-tiles.js"></script>
<script src="components/status-tile.js"></script>
<script src="components/try-this.js"></script>
<script src="components/magic-moment-ranker.js"></script>
<script src="components/magic-moment.js"></script>
<script src="components/ready-hub-body.js"></script>
<script src="components/hub-boot.js"></script>
<script src="components/window-chrome.js"></script>
</body>
</html>
