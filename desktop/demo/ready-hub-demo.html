<!-- Browser demo of ready-hub.html. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Bhai Ready Hub — Demo</title>
<link rel="stylesheet" href="../styles.css"/>
<link rel="stylesheet" href="../components/components.css"/>
<style>
    .demo-controls {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 8px 10px; border-radius: 999px;
        background: rgba(20,20,22,0.72); backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: 0 12px 32px rgba(0,0,0,0.25);
        z-index: 1000; font-family: 'Inter', -apple-system, sans-serif;
    }
    .demo-controls a {
        padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
        color: rgba(255,255,255,0.75); text-decoration: none;
        transition: background 150ms ease, color 150ms ease;
    }
    .demo-controls a:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .demo-controls a.active {
        background: linear-gradient(135deg, #c471ed, #ff758c); color: #fff;
    }
    .demo-controls .label {
        padding: 6px 10px; font-size: 11px; font-weight: 600;
        letter-spacing: 0.08em; text-transform: uppercase;
        color: rgba(255,255,255,0.45);
    }
</style>
</head>
<body>
<div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
</div>

<div class="title-bar">
    <span class="title-bar-text">Bhai</span>
    <div class="title-bar-buttons">
        <button class="title-btn" onclick="atlas.minimize()">─</button>
        <button class="title-btn close" onclick="atlas.close()">✕</button>
    </div>
</div>

<div class="wizard-container">
    <div class="wizard-content">
        <div id="hub-root"></div>
    </div>
</div>

<nav class="demo-controls" aria-label="Demo nav">
    <span class="label">Demo</span>
    <a href="wizard-demo.html?step=welcome">← Wizard</a>
    <a href="ready-hub-demo.html" class="active">Ready Hub</a>
</nav>

<!-- Mock with ?step=hub so all tiles are green/populated. -->
<script>
    // Override mock default to the "hub" preset.
    if (!new URL(location.href).searchParams.get("step")) {
        history.replaceState(null, "", "?step=hub");
    }
</script>
<script src="mock-atlas.js"></script>

<script src="../components/tile-model.js"></script>
<script src="../components/diff-tiles.js"></script>
<script src="../components/status-tile.js"></script>
<script src="../components/try-this.js"></script>
<script src="../components/ready-hub-body.js"></script>
<script src="../components/hub-boot.js"></script>
</body>
</html>
