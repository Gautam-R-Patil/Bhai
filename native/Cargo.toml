[package]
name = "atlas-native"
version = "0.1.0"
edition = "2021"
authors = ["XAGI Labs Private Limited"]
description = "Native SIMD-accelerated operations for Bhai"
license = "Proprietary"

[lib]
crate-type = ["cdylib"]

[features]
# Default build excludes voice/VAD because libfvad needs a C compiler (cc-rs +
# clang/gcc/MSVC) which adds ~30-60s to clean builds. Builds that want native
# barge-in detection opt in: `napi build --features vad`.
default = []
vad = ["webrtc-vad"]

[dependencies]
# NAPI-RS for Node.js bindings
napi = { version = "2", features = ["napi9", "tokio_rt"] }
napi-derive = "2"

# Voice activity detection (Phase 3) — gated behind `vad` feature.
webrtc-vad = { version = "0.4", optional = true }

# SIMD-accelerated operations
wide = "0.7"          # Portable SIMD abstractions
simsimd = "6.5"       # High-performance similarity metrics

# Utilities
rayon = "1.10"        # Parallel processing
parking_lot = "0.12"  # Fast mutex
regex = "1"           # Regex patterns
lazy_static = "1.4"   # Lazy pattern compilation
serde = { version = "1", features = ["derive"] }
serde_json = "1"      # JSON interchange
once_cell = "1.20"    # Lazy statics for scheduler global state

# Forge sandbox supervisor (Phase 4 — Plan 2)
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "process", "sync", "macros"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
lru = "0.12"
which = "6"
dashmap = "6"
thiserror = "1"

# Crypto (security module)
aes-gcm = "0.10"      # AES-256-GCM encryption
scrypt = "0.11"        # Key derivation
getrandom = "0.2"      # Crypto-random IV generation
hex = "0.4"            # Hex encoding/decoding
sha2 = "0.10"          # SHA-256 (used by chrome-bridge KDF)

# Platform-specific
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["sched", "process", "fs", "signal"] }
seccompiler = "0.5"
landlock = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_AppLocker",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
