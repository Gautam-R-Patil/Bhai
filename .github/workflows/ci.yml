name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # ponytail: on Linux, tests need the native module (whose Linux build is
    # broken) and model-router tests assert stale model ids; on Windows, path
    # handling fails in ~20 files. Non-blocking until those are fixed.
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # tsc over the whole repo needs more than Node's default heap on a runner.
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # Site Skill tests drive a real headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hermetic
        env:
          # macOS has a committed binary: fail loudly if it stops loading.
          ATLAS_REQUIRE_NATIVE: ${{ matrix.os == 'macos-latest' && 'true' || 'false' }}

  # The codebase predates Biome formatting, so `biome ci .` fails on most files.
  # Only the files a pull request touches are checked, which formats the repo
  # as it is worked on instead of in one sweeping diff.
  lint:
    name: Lint (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome ci --changed --since="origin/$BASE_REF" --no-errors-on-unmatched
        env:
          BASE_REF: ${{ github.base_ref }}

  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: npm ci
        working-directory: native
      - run: npm run build
        working-directory: native

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned so a new stable clippy can't turn CI red without a code change.
          # Bump deliberately (and fix the new lints) when upgrading.
          toolchain: "1.94.1"
          components: clippy, rustfmt
      - run: cargo fmt --check
        working-directory: native
      - run: cargo clippy -- -D warnings
        working-directory: native
